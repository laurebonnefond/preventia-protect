<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect}=React;
const WH="https://hook.eu2.make.com/qhvt4lylqgbykqljwd1sdybpdaoapedu";
const today=()=>new Date().toLocaleDateString("fr-FR");
const nextY=()=>{const d=new Date();d.setFullYear(d.getFullYear()+1);return d.toLocaleDateString("fr-FR")};

/* ═══ MAPPING EPI → Zone + Côté + Picto (descriptions statiques retirées → désormais contextuelles) ═══ */
const EPI_DB=[
  {rx:/casque(?! de soud)/i,        zone:"tete",   s:"L",pic:"M013"},
  {rx:/casque de soud|soudeur/i,    zone:"tete",   s:"L",pic:"M019"},
  {rx:/calot|charlotte/i,           zone:"tete",   s:"L",pic:"M013"},
  {rx:/chapeau|casquette/i,         zone:"tete",   s:"L",pic:"M013"},
  {rx:/cagoule/i,                   zone:"tete",   s:"L",pic:"M016"},
  {rx:/lunette|visière|écran.?fac/i,zone:"yeux",   s:"R",pic:"M004"},
  {rx:/antibruit|bouchon|coquille|auditiv|picb/i,zone:"oreilles",s:"R",pic:"M003"},
  {rx:/masque|ffp|respirat|ari |abek|aération/i,zone:"respir",s:"R",pic:"M016"},
  {rx:/gant(?! therm)/i,            zone:"mains",  s:"L",pic:"M009"},
  {rx:/gant.?therm/i,               zone:"mains",  s:"L",pic:"M009"},
  {rx:/harnais|antichute|longe/i,   zone:"harnais",s:"L",pic:"M018"},
  {rx:/tablier/i,                   zone:"tablier",s:"L",pic:"M026"},
  {rx:/gilet|chasuble|hv/i,         zone:"gilet",  s:"R",pic:"M015"},
  {rx:/blouse/i,                    zone:"torse",  s:"R",pic:"M010"},
  {rx:/surblouse/i,                 zone:"torse2", s:"R",pic:"M010"},
  {rx:/combinaison|tenue(?! de cuis)|vêtement/i,zone:"torse",s:"R",pic:"M010"},
  {rx:/tenue de cuis/i,             zone:"torse",  s:"R",pic:"M010"},
  {rx:/pantalon/i,                  zone:"jambes", s:"L",pic:"M010"},
  {rx:/genouillère/i,               zone:"genoux", s:"R",pic:"M008"},
  {rx:/guêtre|jambière/i,           zone:"mollets",s:"R",pic:"M008"},
  {rx:/chaussure|botte|surchaussure/i,zone:"pieds",s:"L",pic:"M008"},
];
function classify(name){
  const n=name.toLowerCase();
  for(const m of EPI_DB) if(m.rx.test(n)) return m;
  return {zone:"torse",s:"R",pic:"M001"};
}

/* Découpe une liste texte SANS casser les parenthèses :
   "Biologique 3-4 (AES, BMR, TB), CMR" → ["Biologique 3-4 (AES, BMR, TB)","CMR"] */
function smartSplit(s, seps = ",;") {
  const out = []; let depth = 0, cur = "";
  for (const ch of s || "") {
    if (ch === "(") depth++;
    if (ch === ")") depth = Math.max(0, depth - 1);
    if (seps.includes(ch) && depth === 0) { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(x => x.trim()).filter(x => x && x !== "—");
}
function trunc(s, n) { return (s || "").length > n ? s.slice(0, n - 1) + "…" : s; }

/* Les coordonnées de positionnement sont désormais figées dans fiche-epi-template.svg */
/* ═══ Description EPI par défaut (fallback si IA ne fournit pas de desc contextuelle) ═══ */
const DEFAULT_DESC={
  tete:"Protection crânienne contre les chocs et chutes d'objets.",
  yeux:"Protection oculaire contre les projections et éclaboussures.",
  oreilles:"Protection auditive — Obligatoire si Lex,8h ≥ 85 dB(A).",
  respir:"Protection respiratoire adaptée au type de polluant.",
  mains:"Protection des mains contre les risques identifiés.",
  harnais:"Protection antichute — Travail en hauteur > 3m.",
  tablier:"Protection du torse contre projections et contaminations.",
  gilet:"Haute visibilité — Zones de circulation véhicules.",
  torse:"Protection corporelle adaptée à l'environnement de travail.",
  torse2:"Protection contre les projections biologiques ou chimiques.",
  jambes:"Protection des membres inférieurs.",
  genoux:"Protection articulaire lors de travaux au sol.",
  mollets:"Protection complémentaire des jambes.",
  pieds:"Protection plantaire contre chutes d'objets, perforations et glissades.",
};

/* ═══ APP ═══ */
function App(){
  const[page,setPage]=useState("gen");
  const[data,setData]=useState(null);
  const[draft,setDraft]=useState(null);
  const[db,setDb]=useState([]);
  useEffect(()=>{fetch("metiers.json").then(r=>r.json()).then(d=>{if(d.metiers)setDb(d.metiers)}).catch(()=>{});},[]);
  return(<div style={{minHeight:"100vh",background:"#f1f5f9"}}>
    <header className="noP" style={{background:"linear-gradient(135deg,#0c1e3c,#0f766e)",color:"white",padding:"0 16px"}}>
      <div style={{maxWidth:1100,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0"}}>
        <a href="../../../index.html" style={{display:"flex",alignItems:"center",gap:8,color:"white",textDecoration:"none"}}>
          <div style={{width:34,height:34,borderRadius:9,background:"rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>🛡️</div>
          <div><div className="sf" style={{fontSize:17}}>PréventIA Protect</div><div style={{fontSize:8,opacity:.6,letterSpacing:1.5,textTransform:"uppercase"}}>Fiche EPI personnalisée</div></div>
        </a>
        {(draft||data)&&<nav style={{display:"flex",gap:4}}>
          {[["gen","📋 Générer"],...(draft?[["review","✏️ Réviser"]]:[]),...(data?[["view","👁️ Fiche"]]:[])].map(([k,l])=>
            <button key={k} onClick={()=>setPage(k)} style={{padding:"6px 12px",border:"none",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"inherit",background:page===k?"rgba(255,255,255,.9)":"rgba(255,255,255,.12)",color:page===k?"#0c1e3c":"white"}}>{l}</button>)}
        </nav>}
      </div>
    </header>
    <main style={{maxWidth:1100,margin:"0 auto",padding:"16px"}}>
      {page==="gen"&&<Gen db={db} onDone={d=>{setDraft(d);setPage("review")}}/>}
      {page==="review"&&draft&&<Review key={draft.metier+draft.source} d={draft} onValidate={f=>{setData(f);setPage("view")}}/>}
      {page==="view"&&data&&<FV d={data} onBack={()=>setPage("gen")}/>}
    </main>
  </div>);
}

/* ═══ GENERATOR ═══ */
function Gen({db,onDone}){
  const[mode,setMode]=useState("select");const[q,setQ]=useState("");const[sel,setSel]=useState(null);
  const[cm,setCm]=useState("");const[cs,setCs]=useState("");const[cmi,setCmi]=useState("");
  const[ld,setLd]=useState(false);const[err,setErr]=useState(null);
  const filt=q.length>=2?db.filter(m=>m.metier.toLowerCase().includes(q.toLowerCase())||m.secteur?.toLowerCase().includes(q.toLowerCase())).slice(0,20):[];

  /* ─── Mode BASE : on transforme les risques en phases exposantes ─── */
  function go(m){
    const epi=smartSplit(m.epi);
    const epc=smartSplit(m.epc);
    const cut=Math.ceil(epi.length*.65);
    const risques=smartSplit(m.risques);
    /* CHANGEMENT : générer des phases exposantes à partir des risques */
    const phases=risques.map(r=>({phase:r,risque:""})); // base : exposition simple, l'IA enrichit en phase → risque
    onDone({metier:m.metier,secteur:m.secteur,environnement:risques.slice(0,4),phases:phases,epiI:epi.slice(0,cut),epiN:epi.slice(cut),epc,epiDesc:{},ref:m.ref||"",suivi:m.suivi||"",date:today(),version:"1.0",source:"base"});
  }

  /* ─── Mode IA : prompt enrichi pour phases + descriptions contextuelles ─── */
  async function goAI(){
    if(!cm.trim())return setErr("Précisez le métier");setLd(true);setErr(null);
    try{
      const body={model:"claude-sonnet-4-5-20250514",max_tokens:2500,messages:[{role:"user",content:
`Expert IPRP santé au travail. Métier : "${cm}"${cs?`, secteur : "${cs}"`:""}${cmi?`, missions : ${cmi}`:""}.

Réponds UNIQUEMENT en JSON strict (pas de markdown, pas de commentaires) :
{
  "metier": "intitulé exact du poste",
  "secteur": "code NAF ou secteur",
  "environnement": ["3-4 risques principaux synthétiques"],
  "phases": [
    {"phase": "phase de travail exposante (ex: Soins aux patients)", "risque": "type de risque associé (ex: Biologique 3-4 (AES, BMR, tuberculose))"},
    {"phase": "...", "risque": "..."}
  ],
  "epiI": ["EPI indispensables avec norme si possible"],
  "epiN": ["EPI nécessaires selon situations"],
  "epiDesc": {
    "nom exact de l'EPI": "description contextuelle adaptée au métier et à la phase de travail (1 phrase)",
    "...": "..."
  },
  "epc": ["EPC conseillés"],
  "ref": "articles Code du travail applicables",
  "suivi": "type de suivi médical (SIR/SIA/SI)"
}

IMPORTANT :
- "phases" : 4-8 phases de travail concrètes du métier qui exposent à un risque. PAS les risques eux-mêmes.
- "epiDesc" : chaque EPI doit avoir une description contextuelle adaptée au métier. Ex pour IDE : lunettes → "Protection oculaire lors des soins exposant aux projections biologiques (AES, pansements, prélèvements)". JAMAIS de description industrielle pour un métier de soin.
- Chaque clé de epiDesc doit correspondre exactement à un élément de epiI ou epiN.
- RISQUE BIOLOGIQUE (Art. R4421-3, classement 4 groupes) : pour les métiers du soin et de la santé (IDE, aide-soignant, IADE, IBODE, laborantin, agent mortuaire, etc.), l'exposition relève des GROUPES 3-4 (agents pouvant provoquer une maladie grave : tuberculose/M. tuberculosis groupe 3, agents hémorragiques groupe 4, VIH/VHB/VHC groupe 3, BMR). Ne JAMAIS classer un soignant en biologique 2-3 : c'est une sous-cotation. Formuler "Biologique 3-4" avec les agents concernés (AES, BMR, tuberculose, hépatites, VIH).`
      }]};
      const r=await fetch(WH,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({token:"preventia-protect",payload:JSON.stringify(body)})});
      const t=await r.text();let p;
      try{const j=JSON.parse(t);p=JSON.parse((j?.content?.[0]?.text||t).replace(/```json\n?|```/g,"").trim())}catch{throw new Error("Réponse IA invalide")}
      onDone({...p,date:today(),version:"1.0",source:"ia"});
    }catch(e){setErr(e.message)}setLd(false);
  }

  const S={width:"100%",padding:"8px 12px",borderRadius:8,border:"1px solid #cbd5e1",fontSize:13,fontFamily:"inherit",boxSizing:"border-box"};
  return(<div style={{maxWidth:750,margin:"0 auto"}}>
    <h2 className="sf" style={{fontSize:22,marginBottom:4}}>📋 Générer une Fiche EPI</h2>
    <p style={{color:"#64748b",fontSize:13,marginBottom:16}}>{db.length} métiers + IA personnalisée</p>
    <div style={{display:"flex",gap:4,marginBottom:16,background:"#e2e8f0",borderRadius:10,padding:3,maxWidth:400}}>
      {[["select",`📂 Base (${db.length})`],["custom","🤖 IA"]].map(([k,l])=><button key={k} onClick={()=>setMode(k)} style={{flex:1,padding:"8px 12px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit",background:mode===k?"white":"transparent",color:mode===k?"#0c1e3c":"#64748b"}}>{l}</button>)}
    </div>
    {mode==="select"?<div style={{background:"white",borderRadius:16,padding:20,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
      <input value={q} onChange={e=>{setQ(e.target.value);setSel(null)}} placeholder="🔍 Rechercher un métier…" style={{...S,fontSize:14,padding:"10px 14px",marginBottom:12}}/>
      {q.length>=2&&filt.length>0&&<div style={{maxHeight:280,overflowY:"auto",border:"1px solid #e2e8f0",borderRadius:10,marginBottom:12}}>{filt.map(m=><button key={m.id} onClick={()=>{setSel(m);setQ(m.metier)}} style={{display:"block",width:"100%",padding:"8px 12px",border:"none",borderBottom:"1px solid #f1f5f9",background:sel?.id===m.id?"#ecfdf5":"white",textAlign:"left",cursor:"pointer",fontFamily:"inherit",fontSize:12}}><b>{m.metier}</b><br/><span style={{color:"#64748b",fontSize:10}}>{m.secteur} — {m.suivi}</span></button>)}</div>}
      {sel&&<div style={{padding:14,background:"#f0fdf4",borderRadius:12}}><h4 style={{fontSize:14,margin:"0 0 4px"}}>{sel.metier}</h4><p style={{fontSize:11,color:"#64748b",margin:"0 0 4px"}}>{sel.secteur} — <b>{sel.suivi}</b></p><p style={{fontSize:11,margin:"0 0 8px"}}><b>EPI :</b> {sel.epi}</p><button onClick={()=>go(sel)} style={{padding:"10px 20px",borderRadius:10,border:"none",background:"#0f766e",color:"white",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>✅ Générer</button></div>}
    </div>
    :<div style={{background:"white",borderRadius:16,padding:20,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><label style={{gridColumn:"1/-1"}}><span style={{fontSize:11,fontWeight:600,color:"#475569",display:"block",marginBottom:3}}>Métier *</span><input value={cm} onChange={e=>setCm(e.target.value)} style={S}/></label><label><span style={{fontSize:11,fontWeight:600,color:"#475569",display:"block",marginBottom:3}}>Secteur</span><input value={cs} onChange={e=>setCs(e.target.value)} style={S}/></label><label style={{gridColumn:"1/-1"}}><span style={{fontSize:11,fontWeight:600,color:"#475569",display:"block",marginBottom:3}}>Missions</span><textarea value={cmi} onChange={e=>setCmi(e.target.value)} rows={3} style={{...S,resize:"vertical"}}/></label></div>
      <div style={{marginTop:14,display:"flex",gap:10,alignItems:"center"}}><button onClick={goAI} disabled={ld} style={{padding:"10px 20px",borderRadius:10,border:"none",background:"#0f766e",color:"white",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit",opacity:ld?.6:1}}>{ld?"⏳…":"🤖 Générer"}</button>{ld&&<div style={{width:18,height:18,border:"3px solid #e2e8f0",borderTopColor:"#0f766e",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>}</div>
      {err&&<div style={{marginTop:10,padding:10,background:"#fee2e2",borderRadius:10,fontSize:12,color:"#991b1b"}}>⚠️ {err}</div>}
    </div>}
  </div>);
}


/* ═══════════════════════════════════════════════════════════════
   ÉTAPE RÉVISION — l'IPRP garde la main avant génération de la fiche.
   Chaque élément (mission, risque, EPI, EPC) est cochable, éditable,
   supprimable ; les EPI peuvent basculer indispensable ⇄ conditionnel.
   Seuls les éléments COCHÉS sont injectés dans le SVG final.
   ═══════════════════════════════════════════════════════════════ */
const miniB={padding:"4px 8px",borderRadius:7,border:"1px solid #e2e8f0",background:"white",cursor:"pointer",fontSize:11,fontFamily:"inherit",flexShrink:0};

function RevList({icon,title,accent,items,set,other,setOther,swapTitle,addPh}){
  const[nv,setNv]=useState("");
  const upd=(i,p)=>set(items.map((x,j)=>j===i?{...x,...p}:x));
  const del=i=>set(items.filter((_,j)=>j!==i));
  const add=()=>{if(nv.trim()){set([...items,{txt:nv.trim(),on:true}]);setNv("")}};
  const swap=i=>{setOther([...other,items[i]]);del(i)};
  return(<div style={{background:"white",borderRadius:14,padding:16,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
    <h3 style={{fontSize:13,color:accent,marginBottom:10}}>{icon} {title} <span style={{color:"#94a3b8",fontWeight:400,fontSize:11}}>({items.filter(x=>x.on).length}/{items.length} cochés)</span></h3>
    {items.map((x,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
      <input type="checkbox" checked={x.on} onChange={e=>upd(i,{on:e.target.checked})} style={{width:16,height:16,accentColor:accent,cursor:"pointer",flexShrink:0}}/>
      <input value={x.txt} onChange={e=>upd(i,{txt:e.target.value})} style={{flex:1,padding:"5px 9px",borderRadius:7,border:"1px solid #e2e8f0",fontSize:12,fontFamily:"inherit",opacity:x.on?1:.45,textDecoration:x.on?"none":"line-through"}}/>
      {setOther&&<button title={swapTitle} onClick={()=>swap(i)} style={miniB}>⇄</button>}
      <button title="Supprimer" onClick={()=>del(i)} style={{...miniB,color:"#dc2626"}}>✕</button>
    </div>))}
    <div style={{display:"flex",gap:8,marginTop:8}}>
      <input value={nv} onChange={e=>setNv(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder={addPh} style={{flex:1,padding:"5px 9px",borderRadius:7,border:"1px dashed #cbd5e1",fontSize:12,fontFamily:"inherit"}}/>
      <button onClick={add} style={{...miniB,background:accent,color:"white",border:"none"}}>+ Ajouter</button>
    </div>
  </div>);
}

function Review({d,onValidate}){
  const W=a=>(a||[]).map(t=>({txt:t,on:true}));
  const[missions,setMissions]=useState((d.phases||[]).map(p=>({txt:p.risque&&p.risque!==p.phase?`${p.phase} → ${p.risque}`:p.phase,on:true})));
  const[risques,setRisques]=useState(W(d.environnement));
  const[epiI,setEpiI]=useState(W(d.epiI));
  const[epiN,setEpiN]=useState(W(d.epiN));
  const[epc,setEpc]=useState(W(d.epc));
  const keep=l=>l.filter(x=>x.on&&x.txt.trim()).map(x=>x.txt.trim());
  function validate(){
    onValidate({...d,
      phases:keep(missions).map(t=>{const[p,r]=t.split("→").map(s=>s.trim());return{phase:p,risque:r||p}}),
      environnement:keep(risques),
      epiI:keep(epiI),epiN:keep(epiN),epc:keep(epc)});
  }
  return(<div style={{maxWidth:850,margin:"0 auto"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:14}}>
      <div><h2 className="sf" style={{fontSize:22}}>✏️ Réviser avant la fiche</h2>
      <p style={{color:"#64748b",fontSize:12}}>{d.metier} — {d.secteur||"—"} · source : {d.source==="ia"?"🤖 IA":"📂 base"} · décochez ce qui ne concerne pas le poste</p></div>
      <button onClick={validate} style={{padding:"11px 22px",borderRadius:10,border:"none",background:"#0f766e",color:"white",cursor:"pointer",fontSize:14,fontWeight:700,fontFamily:"inherit"}}>✅ Générer la fiche</button>
    </div>
    <div style={{display:"grid",gap:12}}>
      <RevList icon="🎯" title="Missions principales / phases exposantes" accent="#0c1e3c" items={missions} set={setMissions} addPh="Nouvelle mission → risque associé…"/>
      <RevList icon="⚠️" title="Risques supposés du poste" accent="#b45309" items={risques} set={setRisques} addPh="Ajouter un risque…"/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(340px,1fr))",gap:12}}>
        <RevList icon="🟢" title="EPI indispensables" accent="#16a34a" items={epiI} set={setEpiI} other={epiN} setOther={setEpiN} swapTitle="Basculer en conditionnel" addPh="Ajouter un EPI…"/>
        <RevList icon="🟠" title="EPI conditionnels" accent="#d97706" items={epiN} set={setEpiN} other={epiI} setOther={setEpiI} swapTitle="Basculer en indispensable" addPh="Ajouter un EPI…"/>
      </div>
      <RevList icon="⚙️" title="EPC préconisés (protection collective — prioritaire, L.4121-2)" accent="#0f766e" items={epc} set={setEpc} addPh="Ajouter un EPC (captage à la source, encoffrement…)"/>
    </div>
    <div style={{textAlign:"right",marginTop:14}}><button onClick={validate} style={{padding:"11px 22px",borderRadius:10,border:"none",background:"#0f766e",color:"white",cursor:"pointer",fontSize:14,fontWeight:700,fontFamily:"inherit"}}>✅ Générer la fiche</button></div>
  </div>);
}

/* ═══════════════════════════════════════════════════════════════
   FICHE VIEW V4 — Template SVG à positions figées
   Charge fiche-epi-template.svg, remplit les slots par leur id.
   ═══════════════════════════════════════════════════════════════ */

/* Correspondance zone (EPI_DB) → slot du template SVG */
const ZONE_TO_SLOT = {
  tete: "tete",
  yeux: "yeux",
  oreilles: "audition",
  respir: "respiratoire",
  torse: "torse",
  torse2: "torse",
  gilet: "torse",
  tablier: "torse",
  harnais: "harnais",
  mains: "mains",
  jambes: "jambes",
  genoux: "jambes",
  mollets: "jambes",
  pieds: "pieds",
};

/* Petite fonction utilitaire : écrit du texte dans un élément par id */

/* ═══ ANCRES ANATOMIQUES ═══
   Calculées depuis silhouette-body.png (corps px x320-702, y128-1284 / image 1024×1536)
   Facteur k=0.7872 · image posée à x=98.1 y=149.2 → corps SVG x350-650, y250-1160 */
const ANCHOR = {
  tete:         { x: 500, y: 305, side: "L" },
  yeux:         { x: 500, y: 337, side: "R" },
  audition:     { x: 531, y: 346, side: "R" },
  respiratoire: { x: 500, y: 362, side: "R" },
  harnais:      { x: 500, y: 425, side: "R" },
  torse:        { x: 500, y: 485, side: "R" },
  mains:        { x: 379, y: 661, side: "L" },
  jambes:       { x: 426, y: 805, side: "L" },
  pieds:        { x: 410, y: 993, side: "L" },
};
/* Position d'origine de chaque carte dans le SVG (pour calculer le translate) */
const SLOT_HOME = {
  tete:{x:230,y:250}, audition:{x:230,y:365}, mains:{x:230,y:480}, jambes:{x:230,y:595}, pieds:{x:230,y:710},
  yeux:{x:630,y:250}, respiratoire:{x:630,y:365}, torse:{x:630,y:480}, harnais:{x:630,y:595},
};
const CARD_W = 140, CARD_H = 95, ROW_STEP = 105, ROW_TOP = 250, ROW_BOT = 1120;
const COL_X = { L: 230, R: 630 };

/* Repositionne les cartes remplies en lignes consécutives (plus de trous)
   et redessine connecteurs + points d'ancrage vers l'anatomie. */
function reflow(root, filledSlots) {
  const NS = "http://www.w3.org/2000/svg";
  const conn = root.querySelector("#connectors");
  const anch = root.querySelector("#anchors");
  if (conn) conn.textContent = "";
  if (anch) anch.textContent = "";

  const cols = { L: [], R: [] };
  filledSlots
    .sort((a, b) => (ANCHOR[a.slot]?.y || 0) - (ANCHOR[b.slot]?.y || 0))
    .forEach(it => cols[ANCHOR[it.slot]?.side || "R"].push(it));

  /* Rééquilibrage si une colonne déborde (max 8 cartes de 105 px sur 870 px utiles) */
  const MAXC = Math.floor((ROW_BOT - ROW_TOP) / ROW_STEP);
  ["L", "R"].forEach(c => {
    const o = c === "L" ? "R" : "L";
    while (cols[c].length > MAXC && cols[o].length < MAXC) cols[o].push(cols[c].pop());
  });

  for (const side of ["L", "R"]) {
    const list = cols[side];
    /* 1) y idéal = hauteur de la zone du corps ; 2) on écarte les chevauchements */
    let ys = list.map(it => Math.min(Math.max(ANCHOR[it.slot].y - CARD_H / 2, ROW_TOP), ROW_BOT - CARD_H));
    for (let i = 1; i < ys.length; i++) if (ys[i] - ys[i - 1] < ROW_STEP) ys[i] = ys[i - 1] + ROW_STEP;
    const over = ys.length ? ys[ys.length - 1] + CARD_H - ROW_BOT : 0;
    if (over > 0) { ys = ys.map(y => y - over); ys[0] = Math.max(ys[0], ROW_TOP);
      for (let i = 1; i < ys.length; i++) if (ys[i] - ys[i - 1] < ROW_STEP) ys[i] = ys[i - 1] + ROW_STEP; }

    list.forEach((it, i) => {
      const g = root.querySelector("#slot-" + it.slot);
      if (!g) return;
      const home = SLOT_HOME[it.slot];
      g.setAttribute("transform", `translate(${COL_X[side] - home.x},${ys[i] - home.y})`);

      /* Connecteur en équerre : bord intérieur de la carte → ancre anatomique */
      const a = ANCHOR[it.slot]; if (!a || !conn) return;
      const cy = ys[i] + CARD_H / 2;
      const cx = side === "L" ? COL_X.L + CARD_W : COL_X.R;
      const mid = side === "L" ? cx + (a.x - cx) * 0.45 : cx - (cx - a.x) * 0.45;
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", `M ${cx} ${cy} L ${mid} ${cy} L ${mid} ${a.y} L ${a.x} ${a.y}`);
      p.setAttribute("class", "connector " + (it.green ? "connector-green" : "connector-orange"));
      conn.appendChild(p);

      if (anch) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", a.x); c.setAttribute("cy", a.y); c.setAttribute("r", 4.5);
        c.setAttribute("class", "anchor " + (it.green ? "anchor-green" : "anchor-orange"));
        anch.appendChild(c);
      }
    });
  }
}

function setText(root, id, txt) {
  const el = root.querySelector("#" + id);
  if (el) el.textContent = txt || "";
}
function setVisible(root, id, visible) {
  const el = root.querySelector("#" + id);
  if (el) el.style.display = visible ? "" : "none";
}
/* Texte multi-lignes dans un <text> SVG : coupe aux mots, 2 lignes max */
function setWrap(root, id, txt, chars, maxLines) {
  const el = root.querySelector("#" + id);
  if (!el) return;
  const x = el.getAttribute("x");
  const words = (txt || "").split(/\s+/); const lines = []; let cur = "";
  for (const w of words) {
    if ((cur + " " + w).trim().length > chars && cur) { lines.push(cur); cur = w; }
    else cur = (cur + " " + w).trim();
  }
  if (cur) lines.push(cur);
  el.textContent = "";
  lines.slice(0, maxLines).forEach((l, i) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
    t.setAttribute("x", x); t.setAttribute("dy", i === 0 ? 0 : 11);
    t.textContent = (i === maxLines - 1 && lines.length > maxLines) ? trunc(l, chars) : l;
    el.appendChild(t);
  });
}

/* Picto PNG du repo (pictos/MXXX.png) par-dessus le symbole générique */
function setPicto(root, id, pic) {
  const el = root.querySelector("#" + id);
  if (!el) return;
  if (pic) { el.setAttribute("href", "pictos/" + pic + ".png"); el.style.display = ""; }
  else el.style.display = "none";
}

function FV({ d, onBack }) {
  const containerRef = useRef(null);

  const epiI = d.epiI || [];
  const epiN = d.epiN || [];
  const epiDesc = d.epiDesc || {};

  function getDesc(name, zone) {
    if (epiDesc[name]) return epiDesc[name];
    const lc = name.toLowerCase();
    for (const [k, v] of Object.entries(epiDesc)) {
      if (k.toLowerCase().includes(lc) || lc.includes(k.toLowerCase())) return v;
    }
    return DEFAULT_DESC[zone] || "Équipement de protection adapté au risque identifié.";
  }

  /* Remplit les slots du SVG après montage (déclenché aussi quand svgHtml change) */
  useEffect(() => {
    if (!containerRef.current) return;
    const root = containerRef.current;

    try {
      /* ═══ HEADER ═══ */
      setText(root, "header-metier", trunc(d.metier || "—", 34));
      setText(root, "header-secteur", trunc(d.secteur || "—", 30));
      setWrap(root, "header-environnement", (d.environnement || []).join(" • ") || "—", 46, 2);
      setText(root, "date", d.date || today());
      setText(root, "version", d.version || "1.0");

      /* ═══ MISSIONS ═══ */
      const missions = (d.phases || []).map(p =>
        p.risque && p.risque !== p.phase ? `• ${p.phase} → ${p.risque}` : `• ${p.phase}`);
      for (let i = 1; i <= 8; i++) setText(root, `mission-${i}`, trunc(missions[i - 1], 40) || "");

      /* ═══ RISQUES ASSOCIÉS ═══ */
      const risques = d.environnement || [];
      for (let i = 1; i <= 7; i++) setText(root, `risque-${i}`, risques[i - 1] ? trunc(`⚠ ${risques[i - 1]}`, 34) : "");

      /* ═══ EPI INDISPENSABLES / CONDITIONNELS ═══ */
      for (let i = 1; i <= 7; i++) setText(root, `epi-i-${i}`, epiI[i - 1] ? trunc(`✓ ${epiI[i - 1]}`, 33) : "");
      for (let i = 1; i <= 6; i++) setText(root, `epi-c-${i}`, epiN[i - 1] ? trunc(`! ${epiN[i - 1]}`, 33) : "");

      /* ═══ EPC PRÉCONISÉS ═══ */
      const epcL = d.epc || [];
      for (let i = 1; i <= 5; i++) setText(root, `epc-${i}`, epcL[i - 1] ? trunc(`⚙ ${epcL[i - 1]}`, 33) : "");

      /* ═══ DOCUMENTATION ═══ */
      const docs = d.ref ? smartSplit(d.ref, ";·") : [];
      for (let i = 1; i <= 4; i++) setText(root, `doc-${i}`, docs[i - 1] ? trunc(`📄 ${docs[i - 1]}`, 33) : "");

      /* ═══ SLOTS EPI SUR LA SILHOUETTE ═══ */
      const allEPI = [
        ...epiI.map(n => ({ name: n, green: true, ...classify(n), desc: getDesc(n, classify(n).zone) })),
        ...epiN.map(n => ({ name: n, green: false, ...classify(n), desc: getDesc(n, classify(n).zone) })),
      ];
      const slotFilled = {};
      for (const it of allEPI) {
        const slot = ZONE_TO_SLOT[it.zone] || "torse";
        if (!slotFilled[slot]) slotFilled[slot] = it;
      }
      const ALL_SLOTS = ["tete", "yeux", "audition", "respiratoire", "torse", "mains", "jambes", "pieds", "harnais"];
      const filled = [];
      for (const slot of ALL_SLOTS) {
        const it = slotFilled[slot];
        if (it) {
          filled.push({ slot, green: it.green });
          const titEl = root.querySelector(`#slot-${slot}-titre`);
          if (titEl) { titEl.textContent = trunc(it.name.toUpperCase(), 20); titEl.setAttribute("font-size", it.name.length > 16 ? "8" : it.name.length > 11 ? "9.5" : "11"); }
          setWrap(root, `slot-${slot}-desc`, it.desc, 19, 3);
          setPicto(root, `slot-${slot}-picto`, it.pic);
          /* Couleur de la carte selon indispensable (vert) / conditionnel (orange) */
          const g = root.querySelector(`#slot-${slot}`);
          if (g) {
            const rect = g.querySelector("rect"), badge = g.querySelector("circle"), mark = g.querySelector("text");
            if (rect) rect.setAttribute("class", it.green ? "card-green" : "card-orange");
            if (badge) badge.setAttribute("class", it.green ? "green" : "orange");
            if (mark) mark.textContent = it.green ? "✓" : "!";
          }
          setVisible(root, `slot-${slot}`, true);
        } else {
          setVisible(root, `slot-${slot}`, false);
        }
      }
      reflow(root, filled);

      /* ═══ BONNES PRATIQUES / ENTRETIEN ═══ */
      const bp = [
        "Vérifiez vos EPI avant chaque utilisation",
        "Utilisez-les conformément aux consignes",
        "Nettoyez et rangez vos EPI après usage",
        "Remplacez les EPI usés ou endommagés",
        "En cas de doute, demandez conseil"
      ];
      bp.forEach((t, i) => setText(root, `bp-${i + 1}`, `✓ ${t}`));
      const ent = [
        "Nettoyage régulier selon fabricant",
        "Stockage dans un endroit propre et sec",
        "Contrôle périodique de l'état",
        "Remplacement selon durée de vie"
      ];
      ent.forEach((t, i) => setText(root, `ent-${i + 1}`, `• ${t}`));
      setText(root, "verif-prochaine-date", nextY());
    } catch (err) {
      console.error("Erreur remplissage SVG :", err);
    }
  }, [d]);

  async function toPDF() {
    if (!containerRef.current) return;
    const c = await html2canvas(containerRef.current, { scale: 2, useCORS: true, backgroundColor: "#fff" });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("portrait", "mm", "a4");
    const w = 210, h = (c.height * w) / c.width;
    pdf.addImage(c.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, w, Math.min(h, 297));
    if (h > 297) { pdf.addPage(); pdf.addImage(c.toDataURL("image/jpeg", 0.95), "JPEG", 0, -297, w, h); }
    pdf.save(`Fiche_EPI_${(d.metier || "fiche").replace(/[\s/]/g, "_")}.pdf`);
  }

  function toSVG() {
    const svgEl = containerRef.current?.querySelector("svg");
    if (!svgEl) return;
    const s = new XMLSerializer().serializeToString(svgEl);
    const blob = new Blob([s], { type: "image/svg+xml" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Fiche_EPI_${(d.metier || "fiche").replace(/[\s/]/g, "_")}.svg`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return (
    <div>
      <div className="noP" style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
        <button onClick={onBack} style={bS}>← Nouveau métier</button>
        <button onClick={() => window.print()} style={bP}>🖨️ Imprimer</button>
        <button onClick={toPDF} style={{ ...bP, background: "#dc2626" }}>📄 Export PDF</button>
        <button onClick={toSVG} style={{ ...bP, background: "#2563eb" }}>📐 Export SVG</button>
      </div>
      <div
        ref={containerRef}
        className="fiche"
        style={{ background: "white", borderRadius: 8, overflow: "hidden", boxShadow: "0 2px 8px rgba(0,0,0,.08)" }}
        dangerouslySetInnerHTML={{ __html: SVG_TEMPLATE }}
      />
    </div>
  );
}
