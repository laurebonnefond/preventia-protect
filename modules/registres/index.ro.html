<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Registres obligatoires — PréventIA Protect</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5}
.serif{font-family:'DM Serif Display',serif}
header{background:linear-gradient(135deg,#0c1e3c,#1e40af);color:white;padding:16px 20px}
header .inner{max-width:1000px;margin:0 auto}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin:12px 0}
.stat{background:white;border-radius:10px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);border-left:3px solid var(--c)}
.stat b{font-size:22px;color:var(--c);display:block;line-height:1}
.stat small{font-size:9px;color:#64748b}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}
.tab{padding:6px 12px;border-radius:20px;border:1px solid #cbd5e1;background:white;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:4px}
.tab:hover{border-color:#0f766e}
.tab.on{background:#0f766e;color:white;border-color:#0f766e}
.tab .cnt{background:rgba(0,0,0,.15);padding:0 5px;border-radius:10px;font-size:9px;font-weight:700}
.card{background:white;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;margin-bottom:12px}
.card-head{padding:12px 16px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--c);cursor:pointer}
.card-head:hover{background:#f8fafc}
.card-body{display:none;padding:14px 16px;border-top:1px solid #f1f5f9}
.card.open .card-body{display:block}
.card.open .arr{transform:rotate(180deg)}
.arr{font-size:14px;color:#94a3b8;transition:transform .2s;margin-left:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:600}
.btn{padding:7px 16px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:all .15s}
.btn-p{background:#0f766e;color:white}.btn-p:hover{background:#14b8a6}
.btn-s{background:white;border:1px solid #cbd5e1;color:#334155}.btn-s:hover{background:#f8fafc}
.btn-d{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.btn-d:hover{background:#fecaca}
.btn-sm{padding:4px 10px;font-size:10px}
input,select,textarea{width:100%;padding:7px 10px;border-radius:8px;border:1px solid #cbd5e1;font-size:12px;font-family:inherit}
textarea{resize:vertical}
label{display:block;margin-bottom:8px}
label>span{display:block;font-size:10px;font-weight:600;color:#475569;margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
.entry{padding:10px 12px;border-radius:10px;margin-bottom:6px;border-left:3px solid var(--c);background:#f8fafc;font-size:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.entry:hover{background:#f1f5f9}
.entry-info{flex:1;min-width:0}
.entry-info b{display:block;font-size:12px;margin-bottom:2px}
.entry-info p{margin:0;color:#64748b;font-size:11px}
.empty{text-align:center;padding:24px;color:#94a3b8;font-size:12px}
.info{padding:10px;background:#eff6ff;border-radius:10px;font-size:11px;color:#1e40af;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:white;border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
@media print{header,.no-print{display:none!important}body{background:white}}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="inner">
<a href="../../../index.html" class="no-print" style="color:rgba(255,255,255,.7);font-size:11px;text-decoration:none;display:block;margin-bottom:6px">← PréventIA Protect</a>
<div style="display:flex;align-items:center;gap:10"><span style="font-size:24px">📖</span><div><h1 class="serif" style="font-size:18px;margin:0">Registres obligatoires</h1><p style="font-size:11px;opacity:.8;margin:0">14 registres HSE — Saisie, suivi, conformité</p></div></div>
</div></header>
<div class="wrap">
<div class="stats" id="sbar"></div>
<div class="tabs no-print" id="tbar"></div>
<div id="main"></div>
</div>
<div id="mbox"></div>

 fields:[{n:"date",l:"Date",t:"date",r:1},{n:"type",l:"Type",t:"select",o:["Exercice d'évacuation","Vérification extincteurs","Vérification RIA","Vérification désenfumage","Vérification électrique","Formation EPI","Formation ESI","Visite commission de sécurité","Maintenance SSI","Autre"],r:1},{n:"organisme",l:"Organisme / Intervenant",t:"text"},{n:"participants",l:"Participants / Effectif",t:"text"},{n:"duree",l:"Durée",t:"text"},{n:"resultat",l:"Résultat",t:"select",o:["Satisfaisant","À améliorer","Non satisfaisant"]},{n:"observations",l:"Observations",t:"textarea"},{n:"temps_evac",l:"Temps d'évacuation (si exercice)",t:"text"},{n:"prochaine",l:"Prochaine échéance",t:"date"}]},

 fields:[{n:"date_accident",l:"Date de l'accident",t:"date",r:1},{n:"heure",l:"Heure",t:"time",r:1},{n:"victime",l:"Nom de la victime",t:"text",r:1},{n:"poste",l:"Poste / Service",t:"text"},{n:"lieu",l:"Lieu précis",t:"text",r:1},{n:"circonstances",l:"Circonstances détaillées",t:"textarea",r:1},{n:"nature_lesions",l:"Nature des lésions",t:"text",r:1},{n:"siege_lesions",l:"Siège des lésions",t:"text"},{n:"temoins",l:"Témoins (noms)",t:"text"},{n:"soins",l:"Soins dispensés",t:"textarea",r:1},{n:"sst",l:"SST intervenu",t:"select",o:["Oui","Non"]},{n:"reprise",l:"Reprise immédiate",t:"select",o:["Oui","Non"]}]},

{id:"levage",label:"Registre appareils de levage",icon:"🏗️",color:"#0891b2",reg:"Art. R4323-22",tip:"VGP semestrielle appareils, annuelle accessoires. Épreuve statique à la mise en service.",
 fields:[{n:"date",l:"Date",t:"date",r:1},{n:"appareil",l:"Appareil (type, marque)",t:"text",r:1},{n:"num_serie",l:"N° série",t:"text"},{n:"cmu",l:"CMU",t:"text"},{n:"type_controle",l:"Type",t:"select",o:["Épreuve statique","Épreuve dynamique","VGP semestrielle","VGP annuelle accessoires","Examen d'adéquation","Vérification remise en service"],r:1},{n:"organisme",l:"Organisme",t:"text"},{n:"resultat",l:"Résultat",t:"select",o:["Conforme","Non conforme","Réserves"],r:1},{n:"observations",l:"Observations",t:"textarea"},{n:"prochaine",l:"Prochaine échéance",t:"date"}]},

 fields:[{n:"date",l:"Date",t:"date",r:1},{n:"type_epi",l:"Type d'EPI",t:"select",o:["Casque","Lunettes","PICB","APR (masque)","Gants","Chaussures","Harnais","Gilet HV","Tablier","Combinaison","Autre"],r:1},{n:"designation",l:"Désignation (marque, modèle)",t:"text",r:1},{n:"norme",l:"Norme EN",t:"text"},{n:"attribution",l:"Attribué à",t:"text",r:1},{n:"action",l:"Action",t:"select",o:["Mise en service","Vérification périodique","Remplacement (usure)","Remplacement (péremption)","Remplacement (incident)","Retrait du service"],r:1},{n:"etat",l:"État",t:"select",o:["Bon","Usure normale","Usure anormale","Détérioré","Périmé"]},{n:"date_peremption",l:"Date péremption",t:"date"},{n:"observations",l:"Observations",t:"textarea"}]},

{id:"formations",label:"Registre des formations",icon:"🎓",color:"#eab308",reg:"Art. L4141-1",tip:"Formation sécurité obligatoire à l'embauche. Renforcée pour CDD, intérimaires, postes à risque.",
 fields:[{n:"date",l:"Date",t:"date",r:1},{n:"type",l:"Type",t:"select",o:["Accueil sécurité","Formation au poste","Formation renforcée","Formation incendie/évacuation","Formation SST","Gestes et postures","Risque chimique","Travail en hauteur","CACES","Habilitation électrique","Recyclage","Autre"],r:1},{n:"intitule",l:"Intitulé",t:"text",r:1},{n:"formateur",l:"Formateur / Organisme",t:"text",r:1},{n:"duree",l:"Durée (h)",t:"text"},{n:"participants",l:"Participants",t:"textarea",r:1},{n:"attestation",l:"Attestation",t:"select",o:["Oui","Non","En attente"]},{n:"recyclage",l:"Recyclage prévu",t:"date"},{n:"observations",l:"Observations",t:"textarea"}]},

{id:"habilitations",label:"Registre des habilitations",icon:"🪪",color:"#8b5cf6",reg:"R4544-9 / R4323-55",tip:"Recyclage : 3 ans (électrique, ATEX, SST), 5 ans (CACES).",
 fields:[{n:"titulaire",l:"Titulaire (nom, prénom)",t:"text",r:1},{n:"poste",l:"Poste",t:"text"},{n:"type",l:"Type",t:"select",o:["Hab. élec. B0","Hab. élec. B1/B1V","Hab. élec. B2/B2V","Hab. élec. BR","Hab. élec. BC","Hab. élec. H0","Hab. élec. H1/H2","CACES R489","CACES R482","CACES R486","CACES R484","SST","Travail en hauteur","ATEX","Amiante SS3","Amiante SS4","Autre"],r:1},{n:"organisme",l:"Organisme",t:"text",r:1},{n:"date_obtention",l:"Date obtention",t:"date",r:1},{n:"date_expiration",l:"Date expiration",t:"date",r:1},{n:"recyclage_prevu",l:"Recyclage prévu",t:"date"},{n:"observations",l:"Observations",t:"textarea"}]},

{id:"controles",label:"Registre contrôles réglementaires",icon:"🔍",color:"#475569",reg:"Art. R4226-14",tip:"Contrôle électrique annuel. Réserves à lever dans les délais prescrits.",
 fields:[{n:"date",l:"Date contrôle",t:"date",r:1},{n:"installation",l:"Installation / Équipement",t:"text",r:1},{n:"type",l:"Type",t:"select",o:["Installation électrique","Installation gaz","Ascenseur","Porte automatique","Climatisation/thermique","Appareil à pression","Détection incendie","Désenfumage","Autre"],r:1},{n:"organisme",l:"Organisme accrédité",t:"text",r:1},{n:"resultat",l:"Résultat",t:"select",o:["Conforme","Non conforme","Avec réserves"],r:1},{n:"reserves",l:"Réserves",t:"textarea"},{n:"levee",l:"Levée réserves",t:"select",o:["N/A","En cours","Levées","Non levées"]},{n:"rapport",l:"Réf. rapport",t:"text"},{n:"prochaine",l:"Prochaine échéance",t:"date"}]},

{id:"chimique",label:"Registre produits chimiques",icon:"🧪",color:"#be185d",reg:"Art. R4412-1",tip:"FDS à jour obligatoire. CMR : substitution prioritaire, conservation 40 ans.",
 fields:[{n:"date",l:"Date enregistrement",t:"date",r:1},{n:"nom",l:"Nom du produit",t:"text",r:1},{n:"cas",l:"N° CAS",t:"text"},{n:"fournisseur",l:"Fournisseur",t:"text"},{n:"pictogrammes",l:"Pictogrammes GHS",t:"text",ph:"GHS02, GHS07…"},{n:"mentions_h",l:"Mentions H",t:"text",ph:"H225, H319…"},{n:"cmr",l:"CMR",t:"select",o:["Non","Oui — Cat. 1A","Oui — Cat. 1B","Oui — Cat. 2"],r:1},{n:"quantite",l:"Quantité stockée",t:"text"},{n:"lieu_stockage",l:"Lieu stockage",t:"text"},{n:"fds_date",l:"Date FDS",t:"date"},{n:"usage",l:"Usage / Poste",t:"text"},{n:"substitution",l:"Substitution envisagée",t:"text"},{n:"observations",l:"Observations",t:"textarea"}]},

{id:"dechets",label:"Registre des déchets",icon:"♻️",color:"#16a34a",reg:"Art. R541-43 C.env",tip:"BSD retour signé = preuve de traitement conforme. Registre chronologique obligatoire.",
 fields:[{n:"date_enlevement",l:"Date enlèvement",t:"date",r:1},{n:"nature",l:"Nature du déchet",t:"text",r:1},{n:"code",l:"Code déchet",t:"text",ph:"Ex: 15 01 10*"},{n:"categorie",l:"Catégorie",t:"select",o:["Déchet dangereux (DD)","Déchet non dangereux (DND)","DASRI","DEEE","Amiante","Autre"],r:1},{n:"quantite",l:"Quantité (kg ou L)",t:"text",r:1},{n:"transporteur",l:"Transporteur",t:"text",r:1},{n:"destination",l:"Destination",t:"text",r:1},{n:"traitement",l:"Traitement",t:"select",o:["Incinération","Enfouissement","Recyclage","Valorisation","Neutralisation","Autre"]},{n:"bsd_numero",l:"N° BSD",t:"text"},{n:"bsd_retour",l:"BSD retour signé",t:"select",o:["Oui","Non","En attente"]},{n:"observations",l:"Observations",t:"textarea"}]},

{id:"ee",label:"Registre entreprises extérieures",icon:"🏭",color:"#1e40af",reg:"Art. R4512-6",tip:"PdP écrit obligatoire si ≥ 400h/an OU travaux dangereux (arrêté 19/03/1993).",
 fields:[{n:"date_debut",l:"Date début",t:"date",r:1},{n:"date_fin",l:"Date fin prévue",t:"date"},{n:"entreprise",l:"Entreprise extérieure",t:"text",r:1},{n:"activite",l:"Objet intervention",t:"text",r:1},{n:"lieu",l:"Lieu",t:"text"},{n:"effectif",l:"Effectif EE",t:"text"},{n:"contact",l:"Contact EE",t:"text"},{n:"pdp",l:"Plan de Prévention",t:"select",o:["Non requis","PdP écrit établi","PdP en cours","PdP manquant ⚠️"],r:1},{n:"inspection",l:"Inspection préalable",t:"select",o:["Réalisée","À planifier","Non requise"]},{n:"permis",l:"Permis spéciaux",t:"text",ph:"Feu, fouille, consignation…"},{n:"protocole",l:"Protocole sécurité",t:"select",o:["N/A","Établi","Manquant"]},{n:"observations",l:"Observations",t:"textarea"}]},
];

const SK='pp_reg_v2_';
function ld(id){try{return JSON.parse(localStorage.getItem(SK+id))||[]}catch{return[]}}
function sv(id,d){localStorage.setItem(SK+id,JSON.stringify(d))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
let at='all';

function render(){
  let tot=0;const wE=[];R.forEach(r=>{const n=ld(r.id).length;tot+=n;if(n)wE.push(r.id)});
  document.getElementById('sbar').innerHTML=`<div class="stat" style="--c:#334155"><b>14</b><small>Registres</small></div><div class="stat" style="--c:#0f766e"><b>${wE.length}</b><small>Avec entrées</small></div><div class="stat" style="--c:#1e40af"><b>${tot}</b><small>Entrées</small></div><div class="stat" style="--c:#22c55e"><b>${Math.round(wE.length/14*100)}%</b><small>Couverture</small></div>`;

  let th=`<button class="tab${at==='all'?' on':''}" onclick="at='all';render()">📖 Tous</button>`;
  R.forEach(r=>{const n=ld(r.id).length;th+=`<button class="tab${at===r.id?' on':''}" onclick="at='${r.id}';render()" style="${at===r.id?`background:${r.color};color:white;border-color:${r.color}`:''}">${r.icon}${n?` <span class="cnt">${n}</span>`:''}</button>`});
  document.getElementById('tbar').innerHTML=th;

  const list=at==='all'?R:R.filter(x=>x.id===at);
  let h='';
  list.forEach(r=>{
    const ent=ld(r.id), isO=at!=='all';
    h+=`<div class="card${isO?' open':''}" style="--c:${r.color}" id="c-${r.id}">`;
    h+=`<div class="card-head" onclick="document.getElementById('c-${r.id}').classList.toggle('open')"><span style="font-size:20px">${r.icon}</span><div style="flex:1"><b style="font-size:13px">${r.label}</b><br><span style="font-size:10px;color:#64748b">${r.reg} — ${ent.length} entrée(s)</span></div><button class="btn btn-p btn-sm no-print" onclick="event.stopPropagation();openM('${r.id}')" style="background:${r.color}">+ Ajouter</button><span class="arr">▼</span></div>`;
    h+=`<div class="card-body">`;
    if(!ent.length){h+=`<div class="empty">Aucune entrée — cliquez "+ Ajouter"</div>`}
    else{
      const sorted=[...ent].sort((a,b)=>{const da=a.date||a.date_accident||a.date_debut||a.date_enlevement||'',db=b.date||b.date_accident||b.date_debut||b.date_enlevement||'';return db.localeCompare(da)});
      sorted.forEach(e=>{
        const d=e.date||e.date_accident||e.date_debut||e.date_enlevement||'';
        const title=gTitle(r.id,e), sub=gSub(r.id,e), alert=gAlert(e);
        h+=`<div class="entry" style="--c:${r.color}"><div class="entry-info"><b>${d?new Date(d).toLocaleDateString('fr-FR'):'—'} — ${title}</b><p>${sub}</p>${alert}</div><div style="display:flex;gap:4px;flex-shrink:0" class="no-print"><button class="btn btn-s btn-sm" onclick="openE('${r.id}','${e._id}')">✏️</button><button class="btn btn-d btn-sm" onclick="delE('${r.id}','${e._id}')">🗑️</button></div></div>`;
      });
    }
    h+=`<div class="info">📖 <b>${r.reg}</b> — ${r.tip}</div></div></div>`;
  });
  document.getElementById('main').innerHTML=h;
}

function gTitle(id,e){
  const m={securite:e.type,incendie:e.type,accidents:e.victime,radioprotection:e.type,vgp:e.equipement,maintenance:`${e.type||''} — ${e.equipement||''}`,levage:e.appareil,epi:`${e.action||''} — ${e.type_epi||''}`,formations:e.intitule||e.type,habilitations:`${e.titulaire||''} — ${e.type||''}`,controles:`${e.type||''} — ${e.installation||''}`,chimique:`${e.nom||''}${e.cmr&&e.cmr!=='Non'?' 🔶 CMR':''}`,dechets:`${e.nature||''} (${e.categorie||''})`,ee:e.entreprise};
  return m[id]||'Entrée';
}

function gSub(id,e){
  const m={securite:[e.objet,e.resultat,e.organisme],incendie:[e.organisme,e.resultat],accidents:[e.lieu,e.nature_lesions],radioprotection:[e.salarie,e.resultat_dose],vgp:[e.organisme,e.resultat],maintenance:[e.intervenant,e.remise_service],levage:[e.cmu?`CMU:${e.cmu}`:'',e.resultat],epi:[e.designation,e.attribution],formations:[e.formateur,e.duree?e.duree+'h':''],habilitations:[e.organisme,e.date_expiration?'Exp:'+new Date(e.date_expiration).toLocaleDateString('fr-FR'):''],controles:[e.organisme,e.resultat],chimique:[e.fournisseur,e.pictogrammes],dechets:[e.quantite,e.transporteur,e.bsd_numero?'BSD:'+e.bsd_numero:''],ee:[e.activite,e.pdp]};
  return (m[id]||[]).filter(Boolean).join(' • ');
}

function gAlert(e){
  for(const f of['prochaine','date_expiration','recyclage_prevu','date_peremption','echeance','recyclage']){
    if(e[f]){const d=Math.ceil((new Date(e[f])-new Date())/864e5);
      if(d<0)return`<span class="badge" style="background:#fee2e2;color:#dc2626;margin-top:3px">⚠️ Échéance dépassée J+${Math.abs(d)}</span>`;
      if(d<30)return`<span class="badge" style="background:#fef9c3;color:#854d0e;margin-top:3px">⏳ Échéance J-${d}</span>`;
    }
  }
  if(e.pdp==='PdP manquant ⚠️')return`<span class="badge" style="background:#fee2e2;color:#dc2626;margin-top:3px">⚠️ PdP manquant</span>`;
  if(e.resultat==='Non conforme')return`<span class="badge" style="background:#fee2e2;color:#dc2626;margin-top:3px">❌ Non conforme</span>`;
  return'';
}

function openM(regId,data){
  const r=R.find(x=>x.id===regId);if(!r)return;
  const isE=!!data;
  let h=`<div class="modal-bg" onclick="closeM()"><div class="modal" onclick="event.stopPropagation()">`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 class="serif" style="font-size:16px">${r.icon} ${isE?'Modifier':'Ajouter'} — ${r.label}</h3><button class="btn btn-s btn-sm" onclick="closeM()">✕</button></div>`;
  h+=`<form id="ef" onsubmit="sub(event,'${regId}'${isE?`,'${data._id}'`:''})">`; 
  h+=`<div class="grid2">`;
  r.fields.forEach(f=>{
    const v=data?(data[f.n]||''):(f.t==='date'&&(f.n==='date'||f.n==='date_accident'||f.n==='date_debut'||f.n==='date_enlevement')?new Date().toISOString().split('T')[0]:'');
    const sp=f.t==='textarea'?' full':'';
    h+=`<label class="${sp}"><span>${f.l}${f.r?' *':''}</span>`;
    if(f.t==='select'){h+=`<select name="${f.n}"${f.r?' required':''}><option value="">— Choisir —</option>`;f.o.forEach(o=>h+=`<option${v===o?' selected':''}>${o}</option>`);h+=`</select>`}
    else if(f.t==='textarea'){h+=`<textarea name="${f.n}" rows="2"${f.r?' required':''}>${v}</textarea>`}
    else{h+=`<input type="${f.t||'text'}" name="${f.n}" value="${v}"${f.r?' required':''}${f.ph?` placeholder="${f.ph}"`:''}>` }
    h+=`</label>`;
  });
  h+=`</div><div style="display:flex;justify-content:flex-end;gap:6px;margin-top:14px"><button type="button" class="btn btn-s" onclick="closeM()">Annuler</button><button type="submit" class="btn btn-p" style="background:${r.color}">${isE?'💾 Enregistrer':'✅ Ajouter'}</button></div></form></div></div>`;
  document.getElementById('mbox').innerHTML=h;
}
function closeM(){document.getElementById('mbox').innerHTML=''}

function sub(ev,regId,editId){
  ev.preventDefault();const d={};new FormData(ev.target).forEach((v,k)=>{d[k]=v});
  const ent=ld(regId);
  if(editId){const i=ent.findIndex(e=>e._id===editId);if(i>=0)ent[i]={...ent[i],...d}}
  else{d._id=uid();d._created=new Date().toISOString();ent.push(d)}
  sv(regId,ent);closeM();at=regId;render();
}
function openE(regId,eId){const e=ld(regId).find(x=>x._id===eId);if(e)openM(regId,e)}
function delE(regId,eId){if(!confirm('Supprimer cette entrée ?'))return;sv(regId,ld(regId).filter(x=>x._id!==eId));render()}

render();
</script>
