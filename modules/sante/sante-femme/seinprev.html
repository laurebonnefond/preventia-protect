<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SeinPrév</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap">
<link rel="stylesheet" href="femme.css">
<link rel="manifest" href="seinprev.webmanifest">
<meta name="theme-color" content="#b8336a">
<link rel="apple-touch-icon" href="img/app-sein-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes seins">
<style>
/* SeinPrév · suivi du dépistage du cancer du sein et campagne Octobre rose
   Layout : bandeau Protect + onglets ; tableau de bord en tête, puis actions, enquête anonyme, suivi infirmier, parcours salariée */
.ribbon{width:16px;height:22px;flex:none}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps .n{width:30px;height:30px;border-radius:50%;background:var(--rose-bg);color:var(--rose);display:grid;place-items:center;font-weight:700}
.orient{border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.orient.o-ok{background:var(--ok-bg)} .orient.o-warn{background:var(--warn-bg)} .orient.o-rose{background:var(--rose-bg)}
.orient h3{font-family:var(--f-display);font-weight:400;font-size:1.35rem}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:8px;border-bottom:1px dashed var(--line)}
.yn{display:flex;gap:4px}
.yn button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px}
.yn button[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-bg);color:var(--rose)}
.orient.o-bad{background:var(--bad-bg)} .orient.o-bad .eyebrow{color:var(--bad)}
/* Connaître mes seins */
.seg{display:flex;gap:4px;padding:4px;background:var(--card-2);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--card);color:var(--rose);box-shadow:0 1px 3px rgb(20 20 40/.12)}
.seg.sm button{flex:1 1 0;min-width:0;padding:7px 8px;font-size:12.5px;white-space:normal;line-height:1.25}
.seg button.r-ok[aria-selected="true"]{color:var(--ok)} .seg button.r-warn[aria-selected="true"]{color:var(--ink);background:var(--warn-bg)} .seg button.r-bad[aria-selected="true"]{color:var(--bad);background:var(--bad-bg)}
.next{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--rose-bg)}
.next b{font-family:var(--f-display);font-weight:400;font-size:1.35rem;color:var(--rose)}
.tl{display:flex;flex-direction:column;gap:14px;position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--rose-bg)}
.tl > div{position:relative}
.tl .dot{position:absolute;left:-22px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 3px var(--card)}
.tl .dot.alt{background:var(--mauve)}
.stepper{display:flex;flex-direction:column;gap:14px}
.prog{display:grid;grid-auto-flow:column;gap:4px}
.prog i{height:5px;border-radius:99px;background:var(--card-2)} .prog i.on{background:var(--rose)}
.st{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:center;min-height:220px}
.st.noill{grid-template-columns:1fr;min-height:0}
@media (max-width:760px){.st{grid-template-columns:1fr}}
.disp{font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.illbox{background:var(--rose-bg);border-radius:14px;padding:14px;display:grid;place-items:center}
.illbox.photo{background:#fff;padding:6px;overflow:hidden}
.illbox.photo img{width:100%;max-width:460px;height:auto;display:block;border-radius:10px}
.ill{width:100%;max-width:360px;height:auto;fill:none;stroke:var(--rose);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ill .thin{stroke-width:1.2;opacity:.7} .ill .dash,.carte .dash{stroke-dasharray:4 4;stroke-width:1;opacity:.5;stroke:var(--muted)}
.ill .fill{fill:var(--rose);stroke:none} .ill .fill-soft{fill:var(--card);stroke:var(--rose);stroke-width:1.5}
.ill .zonefill{fill:var(--card);stroke:var(--rose);stroke-width:1.2;stroke-dasharray:5 4}
.ill .arrow{stroke:var(--ink);stroke-width:1.6}
.ill text,.carte text{fill:var(--muted);stroke:none;font-size:10.5px;font-family:var(--f-body);text-anchor:middle}
.ill [text-anchor="start"] text,.ill text[text-anchor="start"]{text-anchor:start} .ill text[text-anchor="end"]{text-anchor:end}
.ill .strong text,.carte text.strong{fill:var(--ink);font-weight:700}
.obs ul,.ul{margin:8px 0 0;padding-left:1.1rem;display:grid;gap:6px;font-size:.92rem}
.obs .card{border:0} .obs .o-ok{background:var(--ok-bg)} .obs .o-warn{background:var(--warn-bg)} .obs .o-bad{background:var(--bad-bg)}
.obs .o-ok .eyebrow{color:var(--ok)} .obs .o-bad .eyebrow{color:var(--bad)} .obs h3{margin-top:2px}
/* Illustrations des affiches Octobre rose du SPSTI 23/87 */
.gestes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.gestes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gestes figure,.signes figure{margin:0;display:grid;justify-items:center;gap:8px;text-align:center}
.gestes img{width:100%;max-width:170px;height:auto;aspect-ratio:1;object-fit:contain}
.gestes .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--rose);color:#fff;font-weight:700;font-size:13px}
.gestes figcaption{font-size:.88rem} .gestes figcaption b{display:block}
.signes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.signes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.signes img{width:96px;height:96px;object-fit:contain}
.signes figcaption{font-size:.85rem;font-weight:600}
.credit{font-size:11.5px;color:var(--muted);margin-top:10px}
.duo-img{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;border-radius:14px;padding:8px}
.duo-img img{width:100%;height:auto;display:block}
.carte{width:100%;max-width:380px;height:auto;display:block;margin-inline:auto}
.carte .zn{fill:var(--card-2);stroke:var(--card);stroke-width:2;cursor:pointer;transition:fill .15s}
.carte .zn:hover{fill:var(--rose-bg)} .carte .zn.on{fill:var(--rose)}
.sig{border:0;padding:0;margin:0;display:grid;gap:6px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding-block:10px;border-bottom:1px dashed var(--line)}
details summary{cursor:pointer}
p.f,legend.f{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
/* Mode application (téléphone de la salariée) et partage par QR code */
body.app .back,body.app .pp-top .pill{display:none}
.install{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--rose-bg);border-radius:var(--r);padding:12px 16px}
.install img{width:44px;height:44px;border-radius:11px}
.partage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:700px){.partage{grid-template-columns:1fr}}
.qrbox{background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line);width:max-content}
.lien{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--card-2);padding:4px 8px;border-radius:6px;word-break:break-all}
/* Jeu Super Maria (hébergé sur PréventIA-LaB, affiché dans un cadre) */
.jeu-cadre{position:relative;width:100%;aspect-ratio:860/600;max-height:78vh;border-radius:var(--r);overflow:hidden;background:#1b0b18;box-shadow:var(--shadow)}
.jeu-cadre iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (max-width:700px){.jeu-cadre{aspect-ratio:auto;height:78vh}}
#affichette{display:none}
@media print{body.print-aff>*:not(#affichette){display:none!important}body.print-aff #affichette{display:block}}
#affichette{font-family:var(--f-body,system-ui);text-align:center;padding:30px}
#affichette h1{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0 0 8px;color:#a3245a}
#affichette .qr{display:inline-block;margin:20px 0}
#affichette ol{text-align:left;display:inline-block;font-size:16px;line-height:1.7}
</style>
</head>
<body>
<header class="pp-top gut"><div class="in">
  <a class="back" href="index.html">← Santé de la femme</a>
  <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-2 0-3 1.6-3 3.5 0 2.4 3 6 3 6s3-3.6 3-6C15 4.6 14 3 12 3z"/><path d="M10.5 12.5 7 21M13.5 12.5 17 21"/></svg></div>
  <div><small>PréventIA Protect · Santé de la femme</small><h1>SeinPrév</h1></div>
  <span class="sp"></span><span class="pill">Dépistage du cancer du sein · Octobre rose</span>
</div></header>
<nav class="tabs gut" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<main class="gut" id="app"></main>
<div class="kiosk gut" id="kiosk" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('fr-FR'):'–';

/* ---------- Repères de dépistage (France) ----------
   Bornes du dépistage organisé : la HAS réévalue l'élargissement des âges.
   Modifier ces constantes suffit à mettre l'outil à jour. */
const DEP={AGE_MIN:50, AGE_MAX:74, INTERVALLE_MOIS:24, EXAMEN_CLINIQUE_DES:25};

/* ---------- Couche de données ----------
   Phase 1 : localStorage (ce poste). Phase 2 : Supabase UE pour la campagne et l'enquête anonyme.
   Le suivi infirmier (données de santé) reste local ou chez un hébergeur HDS : jamais dans Supabase. */
const KEY='pp_sein_v1';
const store={get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}};
const SEUIL=5;

const AGES=['Moins de 40 ans','40 à 49 ans','50 à 74 ans','75 ans et plus'];
const MAMMO=['Il y a moins de 2 ans','Il y a 2 à 5 ans','Il y a plus de 5 ans','Jamais','Je ne sais pas'];
const INVIT=['Oui','Non','Je ne sais pas'];
const FREINS=['Manque de temps, horaires de travail','Peur du résultat','Peur que l\'examen fasse mal','Pas reçu ou perdu l\'invitation','Oubli','Je ne me sens pas concernée','Distance, transport','Aucun frein'];
const SOUHAITS=['Mieux comprendre le dépistage','Pouvoir m\'absenter pour l\'examen','Recevoir un rappel','Échanger avec l\'infirmier·e','Rien de particulier'];
const ACT_TYPES=['Stand d\'information','Conférence ou intervention','Atelier','Jeu de prévention','Affichage, flyers','Intervention du CRCDC ou de la Ligue','Marche ou course solidaire','Autre'];
const EXAMS=['Dépistage organisé (mammographie)','Suivi spécialisé (risque élevé)','Examen clinique annuel'];

function demo(){
  const R=[]; const pick=(a,w)=>{let x=Math.random()*w.reduce((s,v)=>s+v,0);for(let i=0;i<a.length;i++){x-=w[i];if(x<=0)return a[i];}return a[0];};
  let seed=7; Math.random=(()=>{return()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}})();
  for(let i=0;i<26;i++){const age=pick(AGES,[3,6,15,1]);R.push({age,mammo:age==='50 à 74 ans'?pick(MAMMO,[9,3,1,1,1]):pick(MAMMO,[2,1,1,6,1]),invit:pick(INVIT,[7,2,2]),
    freins:[pick(FREINS,[6,2,2,3,3,2,1,4])].concat(Math.random()<.4?[pick(FREINS,[3,2,1,2,4,1,1,0])]:[]).filter((v,j,a)=>a.indexOf(v)===j),souhaits:[pick(SOUHAITS,[4,5,4,2,2])]});}
  return {demo:true,cfg:{entreprise:'Logistique du Val (exemple fictif)',effectifF:41,crcdc:'Centre régional de coordination des dépistages des cancers (CRCDC) de votre région'},
    actions:[
      {id:1,date:'2026-10-02',type:ACT_TYPES[0],intervenants:'Infirmière, Ligue contre le cancer',participants:34,notes:'Stand à la pause de midi, flyers et goodies roses.'},
      {id:2,date:'2026-10-09',type:ACT_TYPES[3],intervenants:'Infirmière',participants:22,notes:'Jeu Super Maria sur tablette, quiz en équipe.'},
      {id:3,date:'2026-10-16',type:ACT_TYPES[5],intervenants:'CRCDC',participants:18,notes:'Explication du dépistage organisé, questions-réponses.'},
      {id:4,date:'2026-10-25',type:ACT_TYPES[6],intervenants:'CSE',participants:27,notes:'Marche solidaire de 5 km.'}],
    enquete:R,
    suivi:[
      {id:1,code:'F-014',age:52,date:'2025-03-12',type:EXAMS[0],relance:'',notes:'Invitation reçue, RDV pris.',consent:true},
      {id:2,code:'F-021',age:61,date:'2024-06-03',type:EXAMS[0],relance:'2026-10-05',notes:'Relancée lors d\'Octobre rose.',consent:true},
      {id:3,code:'F-007',age:47,date:'2025-12-10',type:EXAMS[2],relance:'',notes:'',consent:true},
      {id:4,code:'F-030',age:44,date:'2026-02-18',type:EXAMS[1],relance:'',notes:'Suivi gynécologique renforcé.',consent:true},
      {id:5,code:'F-002',age:68,date:'2024-12-01',type:EXAMS[0],relance:'',notes:'',consent:true}]};
}
function blank(){return {demo:false,cfg:{entreprise:'',effectifF:'',crcdc:''},actions:[],enquete:[],suivi:[]};}
let S=store.get()||demo(); const save=()=>store.set(S);

/* ---------- Calculs ---------- */
const addMonths=(d,m)=>{const x=new Date(d+'T00:00');x.setMonth(x.getMonth()+m);return x;};
function echeance(r){const m=r.type===EXAMS[0]?DEP.INTERVALLE_MOIS:12;return addMonths(r.date,m);}
function statut(r){if(!r.date)return {c:'na',l:'Date inconnue'};const j=Math.round((echeance(r)-new Date())/864e5);
  return j<0?{c:'bad',l:`En retard de ${-j} j`,j}:j<=60?{c:'warn',l:`À prévoir (J-${j})`,j}:{c:'ok',l:'À jour',j};}
const count=(arr,key,opts)=>opts.map(o=>({l:o,n:arr.filter(r=>Array.isArray(r[key])?r[key].includes(o):r[key]===o).length}));
const bars=(rows,tot)=>rows.map(r=>`<div class="hbar"><span>${esc(r.l)}</span><span class="t"><i style="width:${tot?r.n/tot*100:0}%"></i></span><b>${tot?Math.round(r.n/tot*100):0} %</b></div>`).join('');

/* ---------- Navigation ---------- */
/* Mode application : ouvert depuis le lien ou le QR code donné à la salariée (?app=1), ou depuis l'icône installée.
   Seules les rubriques personnelles sont visibles ; rien ne quitte le téléphone. */
const APP=new URLSearchParams(location.search).has('app')||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const LIEN_APP=new URL('seinprev.html?app=1#connaitre',location.href).href;
const TABS=APP?[['connaitre','Connaître mes seins'],['parcours','Mon dépistage'],['jeu','Super Maria']]
  :[['bord','Tableau de bord'],['actions','Actions Octobre rose'],['enquete','Enquête anonyme'],['suivi','Suivi infirmier'],['parcours','Mon parcours'],['connaitre','Connaître mes seins'],['jeu','Jeu Super Maria']];
if(APP){document.body.classList.add('app');document.title='Mes seins';
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw-seinprev.js').catch(()=>{});}
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(APP)route();});
function route(){const h=(location.hash||'#'+TABS[0][0]).slice(1);const cur=TABS.some(t=>t[0]===h)?h:TABS[0][0];
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<a href="#${k}" ${k===cur?'aria-current="page"':''}>${l}</a>`).join('');
  ({bord:vBord,actions:vActions,enquete:vEnquete,suivi:vSuivi,parcours:vParcours,connaitre:vConnaitre,jeu:vJeu})[cur]();}
window.addEventListener('hashchange',()=>{route();scrollTo(0,0);});
const intro=(e,t,p,ref)=>`<div class="intro"><div><p class="eyebrow">${e}</p><h2>${t}</h2><p class="muted">${p}</p></div>${ref?`<div class="ref">${ref}</div>`:''}</div>`;
const demoBar=()=>S.demo?`<div class="demo"><span><b>Données d'exemple fictives.</b> Explorez l'outil, puis démarrez votre propre suivi.</span><span class="sp"></span><button class="btn sm" id="newS">Démarrer un suivi vierge</button></div>`:'';
function bindDemo(){const b=$('#newS');if(!b)return;b.onclick=()=>{if(b.dataset.c){S=blank();save();route();}else{b.dataset.c=1;b.textContent='Confirmer : effacer l\'exemple';b.classList.add('danger');}};}

/* ---------- 1. Tableau de bord ---------- */
function vBord(){
  const E=S.enquete, cible=E.filter(r=>r.age==='50 à 74 ans'), eff=+S.cfg.effectifF||0;
  const ajour=cible.filter(r=>r.mammo===MAMMO[0]).length;
  const part=S.actions.reduce((s,a)=>s+(+a.participants||0),0);
  const st=S.suivi.map(statut), nBad=st.filter(s=>s.c==='bad').length, nWarn=st.filter(s=>s.c==='warn').length;
  const masked=E.length<SEUIL, fr=count(E,'freins',FREINS).sort((a,b)=>b.n-a.n);
  const top=fr.filter(f=>f.l!=='Aucun frein'&&f.n>0).slice(0,3).map(f=>f.l);
  const LEV={'Manque de temps, horaires de travail':'Autoriser une absence rémunérée pour la mammographie ou aménager les horaires le jour de l\'examen.',
    'Peur du résultat':'Proposer une intervention du CRCDC ou de la Ligue et des témoignages : un cancer dépisté tôt se soigne mieux.',
    'Peur que l\'examen fasse mal':'Expliquer le déroulé de la mammographie : quelques secondes de compression par sein, examen rapide.',
    'Pas reçu ou perdu l\'invitation':`Rappeler que l'invitation peut être redemandée au ${S.cfg.crcdc||'CRCDC de la région'} ou que le médecin peut prescrire l'examen.`,
    'Oubli':'Proposer un rappel dans l\'agenda (onglet Mon parcours) et une relance lors d\'Octobre rose.',
    'Je ne me sens pas concernée':'Rappeler que 8 cancers du sein sur 10 surviennent après 50 ans, même sans antécédent familial.',
    'Distance, transport':'Recenser les centres de radiologie agréés proches du site et les créneaux du samedi.'};
  app.innerHTML=`${demoBar()}${intro('Synthèse','Tableau de bord du dépistage',"Vue collective et anonyme de la campagne : actions menées, résultats de l'enquête et échéances du suivi infirmier.",`<b>Dépistage organisé :</b> femmes de ${DEP.AGE_MIN} à ${DEP.AGE_MAX} ans, mammographie et examen clinique tous les 2 ans, pris en charge à 100 % sans avance de frais.`)}
  <div class="kpis">
    <div class="kpi"><div class="l">Réponses à l'enquête</div><div class="v">${E.length}</div><div class="d">${eff?`${Math.round(E.length/eff*100)} % des ${eff} salariées`:'Effectif féminin non renseigné'}</div></div>
    <div class="kpi"><div class="l">${DEP.AGE_MIN}-${DEP.AGE_MAX} ans à jour</div><div class="v" style="color:var(--${!masked&&cible.length&&ajour/cible.length>=.7?'ok':'rose'})">${masked||!cible.length?'–':Math.round(ajour/cible.length*100)+' %'}</div><div class="d">${masked?`Masqué sous ${SEUIL} réponses`:`Mammographie de moins de 2 ans · objectif européen 70 %`}</div></div>
    <div class="kpi"><div class="l">Actions menées</div><div class="v">${S.actions.length}</div><div class="d">${part} participations</div></div>
    <div class="kpi"><div class="l">Suivi infirmier</div><div class="v">${S.suivi.length}</div><div class="d"><span style="color:var(--bad)">${nBad} en retard</span> · ${nWarn} à prévoir</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3 style="margin-bottom:8px">Freins au dépistage</h3>${masked?`<p class="muted">Résultats masqués sous ${SEUIL} réponses.</p>`:bars(fr,E.length)}</div>
    <div class="card"><h3 style="margin-bottom:8px">Ce que les salariées souhaitent</h3>${masked?`<p class="muted">Résultats masqués sous ${SEUIL} réponses.</p>`:bars(count(E,'souhaits',SOUHAITS).sort((a,b)=>b.n-a.n),E.length)}</div>
  </div>
  ${!masked&&top.length?`<div class="card"><h3 style="margin-bottom:8px">Leviers d'action pour les freins les plus cités</h3><ul style="margin:0;padding-left:1.1rem;display:grid;gap:6px">${top.map(t=>`<li><b>${esc(t)}</b> : ${esc(LEV[t])}</li>`).join('')}</ul></div>`:''}
  <div class="card grid g3">
    <label class="f">Entreprise<input class="i" data-cfg="entreprise" value="${esc(S.cfg.entreprise)}"></label>
    <label class="f">Effectif féminin<input class="i num" type="number" min="0" data-cfg="effectifF" value="${esc(S.cfg.effectifF)}"></label>

const P={age:52,perso:null,mutation:null,famille:null,radio:null,last:''};
function orientation(){
  const risque=P.perso==='oui'||P.mutation==='oui'||P.radio==='oui', fam=P.famille==='oui', a=+P.age;
  if(risque) return {c:'o-rose',t:'Un suivi spécialisé vous concerne',p:"Avec un antécédent personnel de cancer du sein, une mutation génétique connue ou une radiothérapie du thorax, le dépistage organisé n'est pas adapté. Votre médecin ou votre gynécologue définit un suivi personnalisé, parfois dès un âge jeune."};
  if(fam) return {c:'o-warn',t:'Parlez de vos antécédents familiaux à votre médecin',p:"Selon le nombre de cas, leur âge et le lien de parenté, il peut proposer un suivi plus précoce ou une consultation d'oncogénétique. En attendant, les repères ci-dessous restent valables."};
  if(!a) return null;
  if(a<DEP.EXAMEN_CLINIQUE_DES) return {c:'o-ok',t:'Pas de dépistage à votre âge',p:"Connaître ses seins suffit : si vous remarquez un changement, consultez."};
  if(a<DEP.AGE_MIN) return {c:'o-ok',t:'Un examen clinique des seins chaque année',p:`Dès ${DEP.EXAMEN_CLINIQUE_DES} ans, la palpation des seins par un médecin, un·e gynécologue ou une sage-femme est recommandée une fois par an. La mammographie de dépistage commence à ${DEP.AGE_MIN} ans, sauf facteur de risque.`};
  if(a<=DEP.AGE_MAX) return {c:'o-rose',t:'Le dépistage organisé, tous les 2 ans',p:`Entre ${DEP.AGE_MIN} et ${DEP.AGE_MAX} ans, vous recevez une invitation tous les 2 ans pour une mammographie et un examen clinique, pris en charge à 100 % sans avance de frais. Sans invitation, votre médecin peut prescrire l'examen.`};
  return {c:'o-warn',t:'Parlez-en à votre médecin',p:`Après ${DEP.AGE_MAX} ans, le dépistage organisé s'arrête. Votre médecin décide avec vous de la poursuite d'un suivi.`};
}

/* ---------- 5. Connaître mes seins : guide d'auto-examen et journal personnel ----------
   Repères : INCa et HAS. L'autopalpation n'est pas une méthode de dépistage : elle aide à connaître ses seins
   pour repérer un changement, en complément de l'examen clinique (dès 25 ans) et de la mammographie (50-74 ans).
   Le journal est une donnée de santé personnelle : il reste dans ce navigateur, sur une clé distincte,
   jamais dans le suivi infirmier ni dans Supabase. */
const KEY_MOI='pp_sein_moi_v1';
const moiStore={get(){try{return JSON.parse(localStorage.getItem(KEY_MOI))}catch(e){return null}},set(v){try{localStorage.setItem(KEY_MOI,JSON.stringify(v))}catch(e){}},del(){try{localStorage.removeItem(KEY_MOI)}catch(e){}}};
let M=moiStore.get()||{consent:false,rythme:'regles',regles:'',jour:1,journal:[]};
const saveMoi=()=>{if(M.consent)moiStore.set(M);};
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10);};
const addDays=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return x;};

/* Signes : r = consulter rapidement (dans les jours qui viennent), d = à revérifier après les règles puis consulter s'il persiste */
const SIGNES=[
 {k:'boule',l:'Une boule ou une grosseur nouvelle',d:1},
 {k:'boule_dure',l:'Une boule dure, irrégulière ou qui ne bouge pas',r:1},
 {k:'zone',l:'Une zone plus ferme ou plus épaisse que de l\'autre côté',d:1},
 {k:'douleur',l:'Une douleur localisée, d\'un seul côté, qui dure',d:1},
 {k:'peau',l:'Une fossette, un plissement ou une rétraction de la peau',r:1},
 {k:'orange',l:'Un aspect de « peau d\'orange »',r:1},
 {k:'rouge',l:'Une rougeur, une chaleur ou un gonflement du sein',r:1},
 {k:'mamelon_retr',l:'Un mamelon qui rentre ou change de direction (récent)',r:1},
 {k:'ecoulement',l:'Un écoulement spontané d\'un seul mamelon (clair ou sanglant)',r:1},
 {k:'croute',l:'Une croûte, une plaie ou un eczéma du mamelon qui ne guérit pas',r:1},
 {k:'ganglion',l:'Une grosseur dans l\'aisselle ou au-dessus de la clavicule',r:1},
 {k:'forme',l:'Un changement de taille ou de forme d\'un sein',r:1}
];
const RESULTATS=[
 {k:'rien',l:'Rien de nouveau',c:'ok'},
 {k:'doute',l:'Un doute, à revérifier',c:'warn'},
 {k:'anomalie',l:'Un changement net',c:'bad'}
];
const ZONES={SE:'quadrant supéro-externe (haut, côté aisselle)',SI:'quadrant supéro-interne (haut, côté sternum)',IE:'quadrant inféro-externe (bas, côté aisselle)',II:'quadrant inféro-interne (bas, côté sternum)',C:'mamelon et aréole',A:'aisselle'};
const zoneL=z=>`sein ${z[0]==='D'?'droit':'gauche'}, ${ZONES[z.slice(2)]}`.replace('sein droit, aisselle','aisselle droite').replace('sein gauche, aisselle','aisselle gauche');

/* Prochaine auto-observation : une semaine après le début des règles (seins moins tendus), sinon à date fixe */
function prochaine(){
  const t=new Date();t.setHours(0,0,0,0);
  if(M.rythme==='regles'){
    if(!M.regles) return null;
    let d=addDays(M.regles,7); while(d<t) d=addDays(iso(d),28);
    return {d,l:'environ une semaine après le début des règles (à ajuster à votre cycle)'};
  }
  const j=Math.min(28,Math.max(1,+M.jour||1)); let d=new Date(t.getFullYear(),t.getMonth(),j); if(d<t) d=new Date(t.getFullYear(),t.getMonth()+1,j);
  return {d,l:`le ${j} de chaque mois`};
}
function icsMensuel(d){
  const s=iso(d).replace(/-/g,'');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PreventIA Protect//SeinPrev//FR','BEGIN:VEVENT',`UID:seinprev-auto-${Date.now()}@preventia`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,
   `DTSTART;VALUE=DATE:${s}`,'RRULE:FREQ=MONTHLY','SUMMARY:Observer mes seins (10 minutes)','DESCRIPTION:Miroir puis palpation allongée. En cas de changement : consulter.','END:VEVENT','END:VCALENDAR'].join('\r\n');
}

/* Date de contre-vérification : une semaine après le début des règles suivantes (cycle estimé à 28 jours) */
function recheck(date){
  const t=new Date(date+'T00:00'); if(!M.regles) return addDays(date,28);
  let d=addDays(M.regles,7); while(d<=addDays(date,7)) d=addDays(iso(d),28); return d;
}
/* Conduite à tenir pour une observation */
function conduite(e,prev){
  const sg=SIGNES.filter(s=>e.signes?.includes(s.k)), rouge=sg.filter(s=>s.r);
  const menop=M.rythme!=='regles';
  const persist=prev&&prev.res!=='rien'&&e.res!=='rien'&&(e.zones||[]).some(z=>(prev.zones||[]).includes(z));
  if(rouge.length||e.res==='anomalie') return {c:'bad',t:'Prenez rendez-vous rapidement',p:`${rouge.length?`Signe${rouge.length>1?'s':''} à faire examiner : ${rouge.map(s=>s.l.toLowerCase()).join(' ; ')}. `:''}Consultez dans les jours qui viennent votre médecin traitant, votre gynécologue ou votre sage-femme, sans attendre la prochaine invitation au dépistage. En prenant rendez-vous, dites : « j'ai remarqué un changement au sein ».`};
  if(persist) return {c:'bad',t:'Le changement persiste : consultez',p:`La même zone était déjà notée le ${fmt(prev.date)}. Un changement qui dure d'un cycle à l'autre doit être examiné par un professionnel.`};
  if(e.res==='doute'||sg.length) return menop
    ? {c:'bad',t:'Faites examiner ce changement',p:'Sans règles, les seins varient peu : une boule ou une zone nouvelle se fait examiner, sans attendre un mois.'}
    : {c:'warn',t:'Revérifiez après vos prochaines règles',p:`Beaucoup de seins sont naturellement granuleux et changent avec le cycle. Refaites l'examen de cette zone vers le ${recheck(e.date).toLocaleDateString('fr-FR')}, une semaine après le début des prochaines règles. S'il est toujours là, consultez. Si vous êtes inquiète, consulter dès maintenant est toujours légitime.`};
  return {c:'ok',t:'Rien de nouveau',p:'Continuez une fois par mois, à la même période du cycle. L\'auto-observation ne remplace pas l\'examen clinique ni la mammographie.'};
}

/* Carte des zones (vue dans le miroir : le sein droit apparaît à droite) */
function carte(sel,ro){
  const pt=(cx,cy,r,a)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)].map(v=>v.toFixed(1)).join(' ');
  const slice=(cx,cy,r,a0,a1)=>`M${cx} ${cy} L${pt(cx,cy,r,a0)} A${r} ${r} 0 0 1 ${pt(cx,cy,r,a1)} Z`;
  const sein=(side,cx)=>{const ext=side==='D'?1:-1, cy=100, r=54;
    const Q=ext>0?{SE:[-90,0],IE:[0,90],II:[90,180],SI:[180,270]}:{SI:[-90,0],II:[0,90],IE:[90,180],SE:[180,270]};
    const z=k=>`${side}-${k}`, on=k=>sel.includes(z(k))?' on':'';
    return Object.entries(Q).map(([k,[a,b]])=>`<path class="zn${on(k)}" data-z="${z(k)}" d="${slice(cx,cy,r,a,b)}"><title>${zoneL(z(k))}</title></path>`).join('')
     +`<circle class="zn${on('C')}" data-z="${z('C')}" cx="${cx}" cy="${cy}" r="15"><title>${zoneL(z('C'))}</title></circle>`
     +`<ellipse class="zn${on('A')}" data-z="${z('A')}" cx="${cx+ext*70}" cy="${cy-50}" rx="15" ry="22" transform="rotate(${ext*-30} ${cx+ext*70} ${cy-50})"><title>${zoneL(z('A'))}</title></ellipse>`
     +`<text x="${cx}" y="${cy+76}" class="lab strong">Sein ${side==='D'?'droit':'gauche'}</text>`;};
  return `<svg viewBox="0 0 340 186" class="carte${ro?' ro':''}" role="group" aria-label="Carte des seins, vue dans le miroir">${sein('G',96)}${sein('D',244)}<path d="M170 30v120" class="dash"/></svg>`;
}

let qrLib=null;
async function dessinerQR(el,taille){qrLib||=new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc);});
  try{await qrLib;el.innerHTML='';new QRCode(el,{text:LIEN_APP,width:taille,height:taille,correctLevel:QRCode.CorrectLevel.M});}catch(_){el.textContent='QR code indisponible (connexion ?)';}}
function bindPartage(){
  const inst=$('#instBtn');if(inst)inst.onclick=async()=>{installPrompt.prompt();await installPrompt.userChoice.catch(()=>{});installPrompt=null;route();};
  const d=$('#partage');if(!d)return;
  d.addEventListener('toggle',()=>{if(d.open&&!$('#qrApp').innerHTML)dessinerQR($('#qrApp'),170);});
  const cp=(b,t,l)=>{try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Copié ✓';setTimeout(()=>b.textContent=l,1500);});}catch(_){}};
  $('#cpLien').onclick=e=>cp(e.target,LIEN_APP,'Copier le lien');
  $('#cpMsg').onclick=e=>cp(e.target,MSG_APP(),'Copier un message d\'invitation');
  $('#prAff').onclick=async()=>{let a=$('#affichette');if(!a){a=document.createElement('div');a.id='affichette';document.body.appendChild(a);}
    a.innerHTML=`<h1>Octobre rose · Connaître mes seins</h1><p style="font-size:18px">Un guide gratuit sur votre téléphone, pour apprendre à observer vos seins et repérer un changement.</p>
      <div class="qr" id="qrAff"></div><ol><li>Scannez le QR code avec l'appareil photo</li><li>Ajoutez la page à l'écran d'accueil</li><li>Programmez votre rappel mensuel</li></ol>
      <p style="font-size:14px;color:#555;margin-top:18px">🔒 Votre journal reste sur votre téléphone : personne d'autre n'y a accès.<br>Ce guide ne remplace pas le dépistage. Votre service de santé au travail reste à votre écoute.</p>`;
    await dessinerQR($('#qrAff'),260);document.body.classList.add('print-aff');setTimeout(()=>{print();document.body.classList.remove('print-aff');},300);};
}
function vConnaitre(){
  const nav=`<div class="seg" role="tablist" aria-label="Rubriques">${SUBS.map(([k,l])=>`<button role="tab" aria-selected="${k===sub}" data-sub="${k}">${l}</button>`).join('')}</div>`;
  const P=prochaine();
  const body={
   quand:()=>`<div class="grid g2" style="align-items:start">
     <div class="card grid"><h3>Mon rythme</h3>
       <div class="seg sm">${[['regles','J\'ai mes règles'],['fixe','Je n\'ai pas de règles']].map(([k,l])=>`<button data-ry="${k}" aria-selected="${M.rythme===k}">${l}</button>`).join('')}</div>
       ${M.rythme==='regles'?`<label class="f">Premier jour de mes dernières règles<input class="i" type="date" id="regles" value="${esc(M.regles)}"></label>`:`<label class="f">Jour du mois choisi<input class="i num" type="number" min="1" max="28" id="jour" value="${esc(M.jour)}" style="max-width:120px"></label>`}
       ${P?`<div class="next"><span class="eyebrow">Prochaine auto-observation</span><b class="num">${P.d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</b><span class="muted small">Puis ${P.l}.</span></div>
         <a class="btn" style="justify-self:start" download="observer-mes-seins.ics" href="data:text/calendar;charset=utf-8,${encodeURIComponent(icsMensuel(P.d))}">Ajouter un rappel mensuel à mon agenda</a>`:'<p class="muted small">Indiquez la date pour calculer le bon moment.</p>'}
     </div>
     <div class="card"><h3 style="margin-bottom:10px">Les trois repères selon l'âge</h3>
       <div class="tl">
        <div><span class="dot"></span><b>Tout âge</b><p class="small">Connaître ses seins, une fois par mois. Consulter en cas de changement.</p></div>
        <div><span class="dot"></span><b>Dès ${DEP.EXAMEN_CLINIQUE_DES} ans</b><p class="small">Un examen clinique des seins par un professionnel, chaque année.</p></div>
        <div><span class="dot"></span><b>De ${DEP.AGE_MIN} à ${DEP.AGE_MAX} ans</b><p class="small">Mammographie de dépistage tous les 2 ans, prise en charge à 100 %.</p></div>
        <div><span class="dot alt"></span><b>Risque élevé</b><p class="small">Antécédent, mutation, radiothérapie du thorax : suivi personnalisé (voir « Mon parcours »).</p></div>
       </div></div></div>`,
   comment:()=>{const E=ETAPES[step];return `${GESTES_SPSTI}<div class="card stepper">
       <div class="row"><span class="eyebrow num">Étape ${step+1} / ${ETAPES.length}</span><span class="sp"></span><span class="muted small">≈ 10 minutes en tout</span></div>
       <div class="prog" aria-hidden="true">${ETAPES.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>
       <div class="st ${E.ill?'':'noill'}">${E.ill?illHtml(E.ill):''}<div class="grid" style="gap:8px;align-content:start"><h3 class="disp">${E.t}</h3>${E.p.map(p=>`<p>${p}</p>`).join('')}</div></div>
       <div class="row"><button class="btn ghost" id="sPrev" ${step?'':'disabled'}>Étape précédente</button><span class="sp"></span>
         ${step<ETAPES.length-1?'<button class="btn" id="sNext">Étape suivante</button>':'<button class="btn" id="sJour">Noter le résultat</button>'}</div></div>
     <details class="card"><summary><b>Voir toutes les étapes sur une page</b></summary><ol class="steps" style="margin-top:12px">${ETAPES.map((e,i)=>`<li><span class="n">${i+1}</span><div><b>${e.t}.</b> ${e.p.join(' ')}</div></li>`).join('')}</ol></details>`;},
   observer:()=>`${SIGNES_SPSTI}<div class="grid g3 obs">
     <div class="card o-ok"><p class="eyebrow">Souvent normal</p><h3>Ce que l'on sent sans s'inquiéter</h3><ul>
       <li>Une texture granuleuse ou bosselée, la même des deux côtés.</li><li>Une crête ferme en bas du sein (sillon sous-mammaire) et les côtes.</li>
       <li>Des seins gonflés, tendus ou sensibles avant les règles.</li><li>Une différence de taille ancienne entre les deux seins.</li>
       <li>Un mamelon tourné vers l'intérieur depuis toujours.</li></ul></div>
     <div class="card o-warn"><p class="eyebrow">À revérifier</p><h3>Refaire l'examen après les règles</h3><ul>
       <li>Une zone plus ferme ou plus granuleuse d'un seul côté.</li><li>Une petite boule souple, mobile, sensible, apparue avant les règles.</li>
       <li>Une douleur localisée d'un seul côté.</li></ul>
       <p class="small" style="margin-top:8px"><b>Toujours là après les règles ?</b> Consultez. Sans règles, consultez directement.</p></div>
     <div class="card o-bad"><p class="eyebrow">Consulter rapidement</p><h3>Prendre rendez-vous dans les jours qui viennent</h3><ul>
       ${SIGNES.filter(s=>s.r).map(s=>`<li>${s.l}.</li>`).join('')}</ul></div></div>
     <div class="card"><h3 style="margin-bottom:6px">Ce qu'une anomalie peut être</h3><p class="muted small" style="margin-bottom:10px">La plupart des anomalies des seins ne sont pas des cancers. Mais seul un examen (clinique, échographie, mammographie, parfois prélèvement) permet de faire la différence : on ne conclut jamais seule.</p>
       <div class="tw"><table><thead><tr><th>Ce que l'on remarque</th><th>Causes fréquentes, souvent bénignes</th><th>Pourquoi consulter quand même</th></tr></thead><tbody>
        <tr><td>Boule ronde, souple, mobile</td><td>Kyste, adénofibrome (femme jeune)</td><td>Confirmer la nature par échographie</td></tr>
        <tr><td>Seins bosselés et douloureux selon le cycle</td><td>Mastose (seins fibrokystiques), variations hormonales</td><td>Si une zone se distingue du reste ou persiste</td></tr>
        <tr><td>Rougeur, chaleur, douleur, parfois fièvre</td><td>Mastite, surtout pendant l'allaitement</td><td>Traitement adapté ; une rougeur sans fièvre qui dure doit être vérifiée</td></tr>
        <tr><td>Écoulement des deux seins, laiteux</td><td>Hormonal, médicaments, allaitement récent</td><td>Un écoulement d'un seul côté, spontané ou sanglant, se fait toujours examiner</td></tr>
        <tr><td>Boule dure, irrégulière, fixe, peau qui se rétracte</td><td>Parfois bénin (cicatrice, cytostéatonécrose)</td><td>Signe à faire examiner rapidement</td></tr>
       </tbody></table></div></div>`,
   journal:()=>{const J=[...M.journal].sort((a,b)=>b.date.localeCompare(a.date));
     if(!draft) draft={date:iso(new Date()),res:'rien',zones:[],signes:[],note:''};
     const prev=J.find(e=>e.date<draft.date); const c=conduite(draft,prev);
     return `${M.consent?'':`<div class="secret"><b>Votre journal reste sur cet appareil.</b> Il n'est envoyé à personne, ni à l'infirmier·e ni à l'employeur. Utilisez votre téléphone personnel, jamais un poste partagé.
         <label class="check" style="margin-top:8px"><input type="checkbox" id="consent"> J'accepte que mon journal soit enregistré dans ce navigateur.</label></div>`}
     <div class="grid g2" style="align-items:start">
      <form class="card grid" id="fj"><h3>Nouvelle observation</h3>
        <label class="f">Date<input class="i" type="date" id="jd" value="${esc(draft.date)}" max="${iso(new Date())}"></label>
        <div class="seg sm" role="group" aria-label="Résultat">${RESULTATS.map(r=>`<button type="button" data-res="${r.k}" aria-selected="${draft.res===r.k}" class="r-${r.c}">${r.l}</button>`).join('')}</div>
        ${draft.res!=='rien'?`<div><p class="f" style="margin-bottom:4px">Où ? <span class="muted">(touchez les zones, vue dans le miroir)</span></p>${carte(draft.zones)}
          <p class="small muted">${draft.zones.length?draft.zones.map(zoneL).join(' · '):'Aucune zone sélectionnée'}</p></div>
          <fieldset class="sig"><legend class="f">Ce que j'ai remarqué</legend>${SIGNES.map(s=>`<label class="check"><input type="checkbox" data-sig="${s.k}" ${draft.signes.includes(s.k)?'checked':''}> ${s.l}</label>`).join('')}</fieldset>`:''}
        <label class="f">Note (facultatif)<textarea class="i" id="jn" placeholder="Ex. : petite boule souple en haut à gauche, sensible">${esc(draft.note)}</textarea></label>
        <div class="orient ${c.c==='ok'?'o-ok':c.c==='warn'?'o-warn':'o-bad'}"><p class="eyebrow">Conduite à tenir</p><h3>${c.t}</h3><p>${c.p}</p></div>
        <button class="btn" ${M.consent?'':'disabled'}>Enregistrer dans mon journal</button>
        ${M.consent?'':'<p class="muted small">Sans enregistrement, la conduite à tenir reste valable : rien n\'est conservé.</p>'}
      </form>
      <div class="card"><div class="row" style="margin-bottom:8px"><h3>Mon historique</h3><span class="sp"></span><span class="muted small num">${J.length} observation${J.length>1?'s':''}</span></div>
        ${J.length?`<ol class="hist">${J.map((e,i)=>{const cc=conduite(e,J[i+1]);const R=RESULTATS.find(r=>r.k===e.res);return `<li><span class="pill ${R.c}">${R.l}</span><div><b class="num">${fmt(e.date)}</b>${(e.zones||[]).length?`<span class="small"> · ${e.zones.map(zoneL).join(' · ')}</span>`:''}
          ${e.note?`<p class="small muted">${esc(e.note)}</p>`:''}${e.res!=='rien'?`<p class="small"><b>${cc.t}.</b></p>`:''}</div><button class="btn ghost sm" data-delj="${e.id}" aria-label="Supprimer">✕</button></li>`;}).join('')}</ol>`
          :'<p class="muted">Aucune observation enregistrée.</p>'}
        ${M.consent?`<div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn ghost sm" id="wipe">Effacer tout mon journal</button></div>`:''}</div>
     </div>`;},
   gardefous:()=>`<div class="grid g2">
     <div class="card"><h3 style="margin-bottom:8px">Les règles à garder en tête</h3><ol class="steps">
       <li><span class="n">1</span><div><b>L'auto-examen ne remplace rien.</b> Ni l'examen clinique annuel dès ${DEP.EXAMEN_CLINIQUE_DES} ans, ni la mammographie de ${DEP.AGE_MIN} à ${DEP.AGE_MAX} ans. Un auto-examen normal ne permet pas de repousser une mammographie.</div></li>
       <li><span class="n">2</span><div><b>Un changement ne se surveille pas indéfiniment.</b> Au plus un cycle pour un doute léger ; tout de suite pour un signe net. N'attendez pas la prochaine invitation au dépistage.</div></li>
       <li><span class="n">3</span><div><b>On ne conclut pas seule.</b> Ni pour s'alarmer, ni pour se rassurer : seul un examen fait la différence.</div></li>
       <li><span class="n">4</span><div><b>Une fois par mois suffit.</b> Se palper tous les jours entretient l'inquiétude et rend les changements plus difficiles à repérer.</div></li>
       <li><span class="n">5</span><div><b>Rassurée, mais ça évolue ?</b> Reconsultez. Il est légitime de demander un second avis ou un examen complémentaire.</div></li></ol></div>
     <div class="grid" style="align-content:start">
      <div class="card"><h3 style="margin-bottom:8px">Qui consulter, comment</h3><ul class="ul">
        <li>Votre <b>médecin traitant</b>, votre <b>gynécologue</b> ou une <b>sage-femme</b>. En prenant rendez-vous, précisez : « j'ai remarqué un changement au sein », pour être vue rapidement.</li>
        <li>Ils peuvent prescrire une échographie ou une mammographie à tout âge : il s'agit alors d'un examen de diagnostic, remboursé, et non d'un dépistage.</li>
        <li>L'<b>infirmier·e en santé au travail</b> peut vous montrer le geste, répondre à vos questions et vous orienter, dans le respect du secret professionnel.</li></ul></div>
      <div class="card"><h3 style="margin-bottom:8px">Situations particulières</h3><ul class="ul">
        <li><b>Grossesse, allaitement :</b> les seins changent beaucoup. Une rougeur douloureuse avec fièvre évoque une mastite : consultez. Une boule qui persiste se fait examiner aussi.</li>
        <li><b>Prothèses mammaires :</b> la palpation reste utile ; signalez les prothèses lors des examens. Un gonflement tardif d'un sein se fait examiner.</li>
        <li><b>Hommes :</b> environ 1 % des cancers du sein. Une boule sous le mamelon ou un écoulement chez un homme se fait examiner.</li></ul></div>
      <div class="card"><h3 style="margin-bottom:8px">Parler, se faire aider</h3><ul class="ul">
        <li><b>Cancer info</b> (Institut national du cancer) : <span class="num">0 805 123 124</span>, service et appel gratuits.</li>
        <li><b>Ligue contre le cancer</b>, écoute et soutien : <span class="num">0 800 940 939</span>, appel gratuit.</li>
        <li>L'inquiétude est normale pendant l'attente d'un examen : n'hésitez pas à en parler à l'infirmier·e ou au médecin du travail.</li></ul></div>
     </div></div>`
  }[sub]();
  app.innerHTML=`${intro('Pour chaque salariée · guide et journal personnel','Connaître mes seins',"Quand et comment s'observer, ce qui est normal, ce qui doit faire consulter, et un journal pour comparer d'un mois sur l'autre. Connaître ses seins aide à repérer un changement : ce n'est pas un dépistage à lui seul.",'<b>Sources :</b> Institut national du cancer, Haute Autorité de santé. Cet outil aide à observer, il ne pose pas de diagnostic. En cas de doute, consultez.')}${blocInstall()}${blocPartage()}${nav}${body}`;
  bindPartage();
  app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;vConnaitre();});
  app.querySelectorAll('[data-ry]').forEach(b=>b.onclick=()=>{M.rythme=b.dataset.ry;saveMoi();vConnaitre();});
  const on=(id,ev,f)=>{const el=$('#'+id);if(el)el[ev]=f;};
  on('regles','onchange',e=>{M.regles=e.target.value;saveMoi();vConnaitre();});
  on('jour','onchange',e=>{M.jour=e.target.value;saveMoi();vConnaitre();});
  on('sPrev','onclick',()=>{step=Math.max(0,step-1);vConnaitre();});
  on('sNext','onclick',()=>{step=Math.min(ETAPES.length-1,step+1);vConnaitre();});
  on('sJour','onclick',()=>{sub='journal';step=0;vConnaitre();});
  on('consent','onchange',e=>{M.consent=e.target.checked;saveMoi();vConnaitre();});
  on('jd','onchange',e=>{draft.date=e.target.value;vConnaitre();});
  on('jn','oninput',e=>{draft.note=e.target.value;});
  app.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{draft.res=b.dataset.res;if(draft.res==='rien'){draft.zones=[];draft.signes=[];}vConnaitre();});
  app.querySelectorAll('.carte [data-z]').forEach(z=>z.onclick=()=>{const k=z.dataset.z,i=draft.zones.indexOf(k);i<0?draft.zones.push(k):draft.zones.splice(i,1);vConnaitre();});
  app.querySelectorAll('[data-sig]').forEach(c=>c.onchange=()=>{const k=c.dataset.sig,i=draft.signes.indexOf(k);c.checked?(i<0&&draft.signes.push(k)):(i>=0&&draft.signes.splice(i,1));vConnaitre();});
  on('fj','onsubmit',e=>{e.preventDefault();if(!M.consent)return;M.journal.push({id:Date.now(),...draft,zones:[...draft.zones],signes:[...draft.signes]});saveMoi();draft=null;vConnaitre();});
  app.querySelectorAll('[data-delj]').forEach(b=>b.onclick=()=>{M.journal=M.journal.filter(e=>e.id!==+b.dataset.delj);saveMoi();vConnaitre();});
  on('wipe','onclick',function(){if(this.dataset.c){moiStore.del();M={consent:false,rythme:'regles',regles:'',jour:1,journal:[]};draft=null;vConnaitre();}else{this.dataset.c=1;this.textContent='Confirmer : tout effacer';this.classList.add('danger');}});
}

route();
})();
</script>
</body>
</html>
