<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Questionnaire anonyme — conditions de travail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap">
<style>
/* PréventIA Protect · Diagnostic RPS — page de réponse des salariés (lien ou QR code d'une campagne).
   Mobile d'abord, une question par écran. Questions : rps-data.js (mêmes que la saisie sur place). */
:root{
  --navy:oklch(24% .06 258); --teal:oklch(52% .1 182); --teal-bg:oklch(94% .04 182); --orange:oklch(70% .17 50);
  --bg:oklch(98.2% .004 250); --card:#fff; --card-2:oklch(95.5% .008 250); --line:oklch(91% .01 250);
  --ink:oklch(25% .03 258); --muted:oklch(50% .02 258); --on-accent:#fff; --bad:oklch(55% .2 25); --ok:oklch(52% .13 150); --ok-bg:oklch(94% .05 150);
  --f-display:"DM Serif Display", Georgia, serif; --f-body:"DM Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:oklch(17% .025 258); --card:oklch(22% .03 258); --card-2:oklch(27% .035 258); --line:oklch(33% .03 258);
  --ink:oklch(93% .01 250); --muted:oklch(72% .02 250); --teal:oklch(72% .12 182); --teal-bg:oklch(30% .05 182); --on-accent:oklch(17% .025 258);
  --ok-bg:oklch(30% .06 150); color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);line-height:1.5;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;color:inherit}
.top{background:var(--navy);color:#fff;padding:14px max(16px,env(safe-area-inset-left,0px))}
.top .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.top small{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;opacity:.65}
.top b{font-family:var(--f-display);font-weight:400;font-size:18px}
.lock{margin-left:auto;font-size:11px;padding:4px 10px;border-radius:99px;background:rgb(255 255 255/.12);white-space:nowrap}
#q{flex:1;width:100%;max-width:640px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:400;line-height:1.25}
.kq{font-family:var(--f-display);font-size:1.5rem;line-height:1.25}
.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--teal);font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.secret{border-left:3px solid var(--teal);background:var(--card);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px}
.note{border-left:3px solid var(--orange);background:var(--card);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px}
.kopts{display:grid;gap:10px}
.kopts button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:15px 16px;font-size:1.02rem;font-weight:600;text-align:left}
.kopts button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-bg)}
.kprog{height:6px;background:var(--card-2);border-radius:99px;overflow:hidden}
.kprog i{display:block;height:100%;background:var(--teal);transition:width .25s}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:auto}
.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:700;background:var(--teal);color:var(--on-accent);font-size:1rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;justify-self:start;padding:4px 0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.center{text-align:center;display:grid;gap:12px;justify-items:center}
.ok-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok);font-size:30px}
</style>
</head>
<body>
<header class="top"><div class="in"><div><small>PréventIA Protect · Santé au travail</small><b id="titre">Questionnaire anonyme</b></div><span class="lock">🔒 Anonyme</span></div></header>
<main id="q"><p class="muted">Chargement…</p></main>

<script src="rps-data.js"></script>
<script src="../sante-femme/enquetes.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), Q = $('#q');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
  const P = new URLSearchParams(location.search);
  const code = (P.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const EQS = (P.get('e') || '').split('|').map(s => s.trim()).filter(Boolean).slice(0, 40);
  const DEJA = 'pp_enq_fait_' + code;
  const { ITEMS, HEALTH, LIK, COP_SETS, COP_ITEMS } = RPSQ;
  const TYPES = {
    rps_baro: { k: 'baro', titre: 'Baromètre de la qualité de vie au travail', duree: 4, Q: [...ITEMS, ...HEALTH].map(x => ({ t: x.t, opts: [...LIK].reverse() })) },
    rps_copsoq: { k: 'copsoq', titre: 'Questionnaire COPSOQ', duree: 10, Q: COP_ITEMS.map(it => ({ t: it.t, opts: COP_SETS[it.set] })) }
  };
  let camp, T, eq = null, i = 0, a = [];

  const ecran = html => { Q.innerHTML = html; scrollTo(0, 0); };
  const erreur = msg => ecran(`<div class="center" style="margin-top:30px"><h2>Questionnaire indisponible</h2><p class="muted">${esc(msg)}</p></div>`);

  function accueil() {
    ecran(`<p class="eyebrow">${esc(camp.entreprise || 'Votre entreprise')}</p>
      <h1 class="kq">Comment se passe votre travail ?</h1>
      <p>${T.Q.length} questions, environ ${T.duree} minutes. Répondez selon ce que vous vivez <b>ces derniers mois</b>. Il n'y a pas de bonne ou de mauvaise réponse.</p>
      <div class="secret"><b>Votre anonymat est protégé.</b> Ni votre nom, ni votre adresse e-mail, ni l'heure de réponse ne sont enregistrés. Personne ne peut lire une réponse isolée : les résultats ne sont présentés que par groupe d'au moins ${ENQ.CONFIG.seuil} personnes.</div>
      <p class="muted small">Vous pouvez passer une question avec « Je préfère ne pas répondre ». La participation est libre.</p>
      ${localStorage.getItem(DEJA) ? '<div class="note">Vous avez déjà répondu depuis cet appareil. Merci ! Ne répondez qu\'une fois par personne.</div>' : ''}
      <div class="nav"><span></span><button class="btn" id="go">Commencer</button></div>`);
    $('#go').onclick = () => EQS.length > 1 ? equipe() : (eq = EQS[0] || 'Ensemble', i = 0, question());
  }
  function equipe() {
    ecran(`<div class="kprog"><i style="width:2%"></i></div><h2 class="kq">Dans quelle équipe travaillez-vous ?</h2>
      <p class="muted small">Elle sert seulement à regrouper les résultats. Une équipe de moins de ${ENQ.CONFIG.seuil} répondants n'est jamais affichée seule.</p>
      <div class="kopts">${EQS.map((e, j) => `<button data-e="${j}" aria-pressed="${eq === e}">${esc(e)}</button>`).join('')}</div>
      <div class="nav"><button class="btn ghost" id="prev">← Retour</button><span></span></div>`);
    Q.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { eq = EQS[+b.dataset.e]; i = 0; question(); });
    $('#prev').onclick = accueil;
  }
  function question() {
    const it = T.Q[i], len = it.opts.length - 1, v = a[i];
    ecran(`<div class="kprog"><i style="width:${Math.round(i / T.Q.length * 100)}%"></i></div>
      <p class="muted small">Question ${i + 1} sur ${T.Q.length}</p>
      <h2 class="kq">${esc(it.t)}</h2>
      <div class="kopts">${it.opts.map((l, r) => `<button data-v="${len - r}" aria-pressed="${v === len - r}">${esc(l)}</button>`).join('')}</div>
      <button class="skip" data-v="">Je préfère ne pas répondre</button>
      <div class="nav"><button class="btn ghost" id="prev">← Retour</button><span></span></div>`);
    Q.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { a[i] = b.dataset.v === '' ? null : +b.dataset.v; ++i < T.Q.length ? question() : envoi(); });
    $('#prev').onclick = () => { if (i > 0) { i--; question(); } else EQS.length > 1 ? equipe() : accueil(); };
  }
  function envoi() {
    const n = a.filter(v => v != null).length;
    ecran(`<div class="kprog"><i style="width:100%"></i></div><h2 class="kq">Avant d'envoyer</h2>
      <p>${n} réponse${n > 1 ? 's' : ''} sur ${T.Q.length} questions${EQS.length > 1 ? `, équipe <b>${esc(eq)}</b>` : ''}.</p>
      <label class="check"><input type="checkbox" id="ok"> J'accepte que ces réponses, sans nom ni date, rejoignent les résultats regroupés de l'entreprise.</label>
      <div class="nav"><button class="btn ghost" id="prev">← Modifier</button><button class="btn" id="send" disabled>Envoyer</button></div><p id="st" class="small"></p>`);
    $('#ok').onchange = e => $('#send').disabled = !e.target.checked;
    $('#prev').onclick = () => { i = T.Q.length - 1; question(); };
    $('#send').onclick = async () => {
      $('#send').disabled = true; $('#st').textContent = 'Envoi…';
      const rep = T.k === 'copsoq'
        ? { eq, a: T.Q.map((_, j) => a[j] ?? null), v: 1 }
        : { eq, a: ITEMS.map((_, j) => a[j] ?? null), h: HEALTH.map((_, j) => a[ITEMS.length + j] ?? null), v: 1 };
      try {
        await ENQ.repondre(code, rep);
        try { localStorage.setItem(DEJA, '1'); } catch (_) {}
        ecran(`<div class="center" style="margin-top:20px"><div class="ok-ic">✓</div><h2>Merci, vos réponses sont enregistrées</h2>
          <p class="muted">Elles ont été ajoutées de façon anonyme. Vous pouvez fermer cette page.</p>
          <div class="secret" style="text-align:left">Si vous traversez une période difficile, vous pouvez demander à voir le <b>médecin ou l'infirmier·e du travail</b> à tout moment, sans passer par votre employeur ; ils sont tenus au secret médical. En cas d'urgence, appelez le 15. Si vous avez des idées suicidaires, le <b>3114</b> répond 24 h/24.</div></div>`);
      } catch (e) { $('#st').innerHTML = `<span style="color:var(--bad)">⚠ ${esc(e.message)}</span>`; $('#send').disabled = false; }
    };
  }

  (async function demarrer() {
    if (!code) return erreur("Ce lien est incomplet. Demandez le lien ou le QR code à la personne qui organise le questionnaire.");
    try { camp = await ENQ.info(code); } catch (e) { return erreur(e.message); }
    if (!camp) return erreur("Ce lien ne correspond à aucun questionnaire.");
    if (!camp.ouverte) return erreur("Ce questionnaire est terminé. Merci de votre intérêt.");
    T = TYPES[camp.outil];
    if (!T) return erreur("Ce lien ne correspond pas à un questionnaire sur les conditions de travail.");
    $('#titre').textContent = T.titre;
    document.title = T.titre + ' — anonyme';
    accueil();
  })();
})();
</script>
</body>
</html>
